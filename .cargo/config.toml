# cmx-portalservice 使用国内 aliyun 镜像源拉取 crates.io（与 cmx-container / cmx-flowengine 一致，已验证可达）。
# 本 ws 无域内 crate；薄 bin 走跨 workspace path 引 cmx-container 的 cmx-platform-app，外部 crate 从
# crates.io（aliyun 镜像）拉取。
[source.crates-io]
replace-with = 'aliyun'

[source.aliyun]
registry = "sparse+https://mirrors.aliyun.com/crates.io-index/"

# nora 私仓：本 ws 自身不从 nora 拉任何依赖（薄 bin 只 path 引 cmx-platform-app + tokio），但必须在此
# **定义**该 registry 名字——因为跨 workspace path 引用的 cmx-platform-app 以 version.workspace/
# edition.workspace 继承自 cmx-container 根 manifest，Cargo 需完整解析该根，其中含 [patch.nora]；
# 若当前配置无 nora 定义则解析失败（"patch entry nora should be a URL or registry name"）。
# cmx-container/.cargo/config.toml 是本 ws 的 sibling 而非 ancestor，不会被自动合并，故在此镜像其
# nora 定义。该 patch 目标 cmx-plugin-sdk 不在 cmx-platform-app 依赖图中（cargo tree -i 已验证），
# 故 nora index 实际从不被拉取。
[registries.nora]
index = "sparse+http://192.168.157.46:4000/cargo/index/"

[http]
check-revoke = false

[net]
git-fetch-with-cli = true
