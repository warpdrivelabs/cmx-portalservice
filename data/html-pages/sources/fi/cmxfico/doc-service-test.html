 ids1=(ds1.rows||[]).map(function(r){return r.id;});\n      if(ids1.length<2) return '根层仅 '+ids1.length+' 行，样本不足（通过）';\n      var cur=C.encodeCursor([], ids1[ids1.length-1]);\n      var q2={layers:{}}; q2.layers[rootId]={orderBy:['id'],limit:2,cursor:cur};\n      return C.loadDocData(null, Object.assign({}, DEF, {apiPath:'/api/doc/data/tokio-zmc-json', query:q2})).then(function(p2){\n        var ids2=(Object.values(p2.dsMap)[0].rows||[]).map(function(r){return r.id;});\n        if(ids2.some(function(id){return ids1.indexOf(id)>=0;})) throw new Error('page 重叠 '+ids1+' / '+ids2);\n        return 'page1=['+ids1+'] → page2=['+ids2+']（无重叠）';\n      });\n    });\n  }).then(render);\n}).then(function(){\n  // 懒下钻\n  if(!secondId) return;\n  return step('POST /children 懒下钻（'+secondId+'）', function(){\n    var q1={depth:1,layers:{}}; q1.layers[rootId]={limit:2};\n    return C.loadDocData(null, Object.assign({}, DEF, {apiPath:'/api/doc/data/tokio-zmc-json', query:q1})).then(function(p1){\n      var parentIds=(Object.values(p1.dsMap)[0].rows||[]).map(function(r){return r.id;});\n      if(!parentIds.length) return '根层无行，跳过';\n      return C.loadChildren(null, DEF, {layer:secondId, parentIds:parentIds, depth:0}).then(function(res){\n        return '父 ['+parentIds+'] → '+secondId+' 子树 '+(res.pkg.rows||[]).length+' 行';\n      });\n    });\n  }).then(render);\n}).then(function(){\n  // 真流式\n  return step('GET tokio-zmc-stream（真·流式分帧解码）', function(){\n    if(typeof C.loadDocDataStream!=='function') throw new Error('loadDocDataStream 未加载');\n    return C.loadDocDataStream(null, Object.assign({}, DEF, {layer:rootId, limit:1000}), {}).then(function(pkg){\n      if(!pkg||pkg.datasetId==null) throw new Error('流未产出有效包');\n      var ds=C.CmxDataSet?C.CmxDataSet.fromJSON(pkg):{length:pkg.rows.length};\n      return '分帧流 → datasetId='+pkg.datasetId+' · '+pkg.rows.length+' 行 · '+pkg.columns.length+' 列 · fromJSON='+ds.length+' 行';\n    });\n  }).then(render);\n}).then(function(){\n  return ste
