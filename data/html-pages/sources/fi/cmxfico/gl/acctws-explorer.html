<style>
  .acctws-explorer-root {

    --acct-border: color-mix(in srgb, var(--acct-cyan) 14%, var(--sapGroup_ContentBorderColor, #e0e0e0));

  }
  .acctws-explorer-head {

    border-bottom: 1px solid var(--acct-border);
    background: linear-gradient(105deg, color-mix(in srgb, var(--acct-cyan) 8%, var(--sapList_Background,#fff)), color-mix(in srgb, var(--acct-violet) 5%, transparent) 60%, transparent);

  }

  }

    color: var(--sapTitleColor,#223548); letter-spacing: 0.02em;
  }
  .acctws-head-spacer { flex: 1; min-width: 4px; }
  .acctws-period-label {
    position: relative; z-index: 1; color: var(--sapContent_LabelColor,#6a6d70);
    font-size: 0.72rem; font-weight: 500;
  }
  .acctws-period-select {
    position: relative; z-index: 1; width: 6.1rem; min-width: 6.1rem;
  }
  .acctws-tree-wrap {
    height: 100%; min-height: 0; display: flex; flex-direction: column;
    padding: 0; box-sizing: border-box;
    background:
      radial-gradient(ellipse 120% 80% at 0% 0%, color-mix(in srgb, var(--acct-cyan) 5%, transparent), transparent 55%),
      radial-gradient(ellipse 90% 60% at 100% 100%, color-mix(in srgb, var(--acct-violet) 4%, transparent), transparent 50%);
  }
  .acctws-tree-wrap cmx-web-treeview {
    display: block; flex: 1; min-height: 0; overflow: auto;
    border-radius: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
  }
  .acctws-detail-wrap {
    height: 100%; min-height: 110px; display: flex; flex-direction: column;
    border-top: 0; background: var(--sapList_Background,#fff); overflow: hidden;
  }
  .acctws-detail-title {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px; min-height: 28px; padding: 3px 8px;
    box-sizing: border-box; border-bottom: 1px solid var(--acct-border); font-size: 0.78rem; font-weight: 800;
    color: var(--sapTitleColor,#223548); background: color-mix(in srgb, var(--acct-cyan) 4%, var(--sapList_Background,#fff));
  }
  .acctws-detail-title ui5-icon { width: 0.9rem; height: 0.9rem; color: var(--acct-cyan); }
  #orgDetailForm { flex: 1; min-height: 0; display: block; overflow: auto; }
</style>

</div>
