<script type="application/json" id="__designer_meta__">{"pageData":[],"pageFns":[],"pageServices":[],"pageDeps":[],"pageInterfaces":[{"name":"initPage","enabled":true,"body":"\nvar LEVELS=['batch','headers','account_lines','aux_lines'];\nvar root=host.shadowRoot;\nfunction $(s){return root.querySelector(s);}\nfunction setText(id,v){var e=$('#'+id); if(e)e.textContent=(v==null?'':String(v));}\nfunction fmt(x){var n=+x||0;return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}\nvar lib=globalThis.__cmxDataComp||host.__cmxClasses;\nfunction modelHost(){ try{ return host.workspace&&host.workspace.pageview&&host.workspace.pageview['fico-ws-doc-model']||null; }catch(e){ return null; } }\nfunction getMS(){ var m=modelHost(); return m&&m.voucherMS||null; }\nfunction ctx(){ try{ return host.workspace&&host.workspace.context||null; }catch(e){ return null; } }\nfunction fireModelReady(kind){ try{ window.dispatchEvent(new CustomEvent('cmx-fico-doc-model',{detail:{kind:kind}})); }catch(e){} }\n/* 一次性等就绪:kind='meta'(列模型就绪) | 'data'(第1张凭证装入)。先查标志命中即同步回调,否则监听事件+长间隔兜底。 */\nfunction onModelReady(kind, cb){\n  function hit(m){ if(!m) return false; return kind==='meta' ? m.__metaReady : m.__ready; }\n  var m=modelHost(); if(hit(m)){ cb(m); return; }\n  function h(ev){ var mm=modelHost(); if(hit(mm)){ window.removeEventListener('cmx-fico-doc-model', h); cb(mm); } }\n  window.addEventListener('cmx-fico-doc-model', h);\n  var n=0,t=setInterval(function(){ var mm=modelHost(); if(hit(mm)){ clearInterval(t); window.removeEventListener('cmx-fico-doc-model',h); cb(mm); } if(++n>120){clearInterval(t);} },80);\n}\n/* 持续订阅 model 生命周期事件:kind='page'(批列表页变化) | 'voucher'(当前凭证变化)。纯订阅,不查标志。 */\nfunction onModelEvent(kind, cb){ window.addEventListener('cmx-fico-doc-model', function(ev){ if(ev&&ev.detail&&ev.detail.kind===kind) cb(modelHost()); }); }\n\nsetText('statusText','等待模型...');\nonModelReady('data', function(m){\n  var ms=m.voucherMS;\n  if(m.capOf){ setText('lblAcc', m.capOf('account_lines','gl_account_id')); setText('lblAmt', m.capOf('account_lines','local_dr')); }   /* 字段名来自元数据 */\n  function curAcc(){ try{ var ds=ms._resolveWrap?ms._resolveWrap('batch.headers.account_lines'):null; return ds&&ds.currentRow; }catch(e){return null;} }\n  function refresh(){ var a=curAcc(); a=a&&a.toPlainObject?a.toPlainObject():a; if(!a){return;}\n    var dr=+a.local_dr||0; var avail=Math.round(dr*1.5*100)/100;\n    setText('bgAcc',a.gl_account_id||'—'); setText('bgAmt',fmt(dr));\n    setText('bgAvail',fmt(avail));\n    var res=$('#bgRes'); if(res){ var ok=dr<=avail; res.textContent=ok?'✔ 预算充足':'✘ 超预算'; res.style.color=ok?'#107e3e':'#bb0000'; }\n  }\n  var c=ctx(); if(c){ c.on('change', function(e){ if(e.key==='currentLine'||e.key==='currentVoucherId'||e.key==='currentBatchId'){ setTimeout(refresh,60); } }); }\n  onModelEvent('voucher', function(){ setTimeout(refresh,60); });\n  refresh();\n  setText('statusText','预算联动就绪');\n});\n"},{"name":"getPageApi","enabled":true,"body":"return {};"},{"name":"isDirty","enabled":true,"body":"return false;"}],"dataSources":[],"dataFlow":{"schema":[],"aggregations":[],"relations":[]},"models":[]}</script>
