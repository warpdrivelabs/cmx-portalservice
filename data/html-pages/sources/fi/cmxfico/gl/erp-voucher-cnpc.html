<div style="display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:10px;gap:10px;background:var(--sapBackgroundColor,#f7f7f7);color:var(--sapTextColor,#1d2d3e);">

    <ui5-label id="statusText" slot="endContent" style="font-size:0.8rem;color:var(--sapContent_LabelColor);">加载中</ui5-label>

  </div>

  <div class="biz-bar">

    <span style="flex:1 1 auto;"></span>

  <section class="lvlbox" id="lvlbox-0">

  <section class="lvlbox" id="lvlbox-1">
    <div class="lvl-head"><ui5-title id="lvltitle-1" level="H6" size="H6">分录/行项目</ui5-title></div>
    <cmx-revo-grid id="grid-1" style="display:block;width:100%;height:200px;"></cmx-revo-grid>
  </section>
  <section class="lvlbox" id="lvlbox-2" style="display:none;">

  <style>

    .lvl-head ui5-title{margin:0}
  </style>
</div>
