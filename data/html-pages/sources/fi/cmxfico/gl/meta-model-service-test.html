<div style="display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:10px;gap:10px;background:var(--sapBackgroundColor,#f7f7f7);color:var(--sapTextColor,#1d2d3e);">
  <ui5-bar design="Header" accessible-role="Toolbar">
    <ui5-label wrapping-type="Normal" style="font-weight:800;font-size:1.05rem;">元数据模型服务加载测试</ui5-label>
    <ui5-label id="statusText" slot="endContent" wrapping-type="Normal" style="font-size:0.8rem;color:var(--sapContent_LabelColor);">等待加载</ui5-label>
    <ui5-button slot="endContent" design="Transparent" icon="download" data-eventclick="loadMetaModels('fetch');">fetch 加载</ui5-button>
    <ui5-button slot="endContent" design="Emphasized" icon="connected" data-eventclick="loadMetaModels('service');">serviceFn 加载</ui5-button>
  </ui5-bar>

  <div style="display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--sapInformationBackground,#eaf4ff);border:1px solid var(--sapInformationBorderColor,#bcd8f7);border-radius:4px;">

    <ui5-label id="viaText" wrapping-type="Normal" style="font-weight:700;font-size:0.85rem;">本次加载方式：—（点上方 fetch / serviceFn 按钮）</ui5-label>
  </div>

    <div class="metric pick"><span>DOC 表（选层级）</span><select id="docLevelSel" class="sel" aria-label="选择层级"></select></div>
    <div class="metric pick"><span>DOC 字段集（选层内表 → 看字段）</span><select id="docTableSel" class="sel" aria-label="选择层内表"></select></div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0;flex:1 1 auto;">
    <section class="panel">
      <div class="panel-head">
        <ui5-icon name="database"></ui5-icon>
        <ui5-title id="dctPanelTitle" level="H5" size="H5">字典字段</ui5-title>
        <ui5-label id="dctTableInfo" wrapping-type="Normal"></ui5-label>
      </div>
      <div id="dctFields" class="field-list"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <ui5-icon name="document"></ui5-icon>
        <ui5-title id="docPanelTitle" level="H5" size="H5">单据层表字段</ui5-title>
        <ui5-label id="docTableInfo" wrapping-type="Normal"></ui5-label>
      </div>
      <div id="docFields" class="field-list"></div>
    </section>
  </div>

  <section class="panel" style="flex:0 0 170px;">
    <div class="panel-head">
      <ui5-icon name="inspect"></ui5-icon>
      <ui5-title level="H5" size="H5">加载请求 / 模型摘要</ui5-title>
    </div>
    <pre id="debugText" style="margin:0;padding:10px;overflow:auto;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;"></pre>
  </section>

  <style>
    .metric{background:var(--sapTile_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#d9d9d9);border-radius:4px;padding:10px;display:flex;align-items:center;justify-content:space-between;min-width:0}

    .metric b{font-size:1.2rem;color:var(--sapHighlightColor,#0070f2)}

    .metric.pick span{font-weight:600}

    .panel{background:var(--sapList_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#d9d9d9);border-radius:4px;min-height:0;display:flex;flex-direction:column;overflow:hidden}

    .badge{display:inline-block;border-radius:10px;padding:1px 7px;font-size:0.72rem;background:var(--sapInformationBackground,#eaf4ff);color:var(--sapInformationColor,#0a6ed1);white-space:nowrap}
  </style>
</div>
<script type="application/json" id="__designer_meta__">{"pageData":[],"pageFns":[{"name":"loadMetaModels","params":"mode","body":"var root = host.shadowRoot;\nvar status = root.querySelector('#statusText');\nvar debug = root.querySelector('#debugText');\nfunction setText(id, v) { var el = root.querySelector('#' + id); if (el) el.textContent = v == null ? '' : String(v); }\nfunction esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;'); }\nfunction fieldTitle(f) { return f.fieldComment || f.caption || f.label || f.name || f.fieldName || f.id || ''; }\nfunction renderFields(id, refs) {\n  var box = root.querySelector('#' + id);\n  if (!box) return;\n  if (!refs || !refs.length) { box.innerHTML = '<div class=\"muted\">无字段</div>'; return; }\n  box.innerHTML = refs.map(function(ref) {\n    var f = ref.field || {};\n    return '<div class=\"field-row\">'\n      + '<div><div class=\"name\">' + esc(ref.id || f.fieldName || f.id) + '</div><div class=\"muted\">' + esc(fieldTitle(f)) + '</div></div>'\n      + '<div class=\"muted\">' + esc(f.dataType || '') + '</div>'\n      + '<div class=\"muted\">' + esc(ref.fieldSetId || '本表字段') + '</div>'\n      + '<div><span class=\"badge\">' + esc(ref.source) + '</span></div>'\n      + '</div>';\n  }).join('');\n}\nfunction opt(v, t, sel) { return '<option value=\"' + esc(v) + '\"' + (sel ? ' selected' : '') + '>' + esc(t) + '</option>'; }\nfunction fillSel(id, items, getV, getT, selV) {\n  var sel = root.querySelector('#' + id); if (!sel) return null;\n  sel.innerHTML = (items || []).map(function(it) { var v = getV(it); return opt(v, getT(it), String(v) === String(selV)); }).join('');\n  if (selV != null && selV !== '') sel.value = String(selV);\n  return sel;\n}\nfunction waitForLib() {\n  return new Promise(function(resolve, reject) {\n    var n = 0;\n    var timer = setInterval(function() {\n      var lib = globalThis.__cmxDataComp;\n      if (lib && typeof lib.loadMetaModelsBatch === 'function') { clearInterval(timer); resolve(lib); return; }\n      n += 1;\n      if (n > 100) { clearInterval(timer); reject(new Error('cmx-data-comp loadMetaModelsBatch 未就绪')); }\n    }, 50);\n  });\n}\n/* —— 纯内存渲染：下拉切换只读 host.dctMeta / host.docMeta（已装载的模型实例），绝不再请求后端 —— */\nfunction renderDct() {\n  var m = host.dctMeta; if (!m) return;\n  var t = m.getTable('gl_account') || m.listTables()[0] || null;\n  if (!t) { setText('dctPanelTitle', '字典（无）'); setText('dctTableInfo', ''); renderFields('dctFields', []); return; }\n  setText('dctPanelTitle', '字典：' + t.name + '（' + t.id + '）');\n  setText('dctTableInfo', t.listFieldSetIds().length + ' 字段集 · ' + t.listFieldRefs().length + ' 字段');\n  renderFields('dctFields', t.listFieldRefs());\n}\nfunction docLevels() {\n  var m = host.docMeta; if (!m) return [];\n  var sc = m.getPath('voucherSchema.schema');\n  if (Array.isArray(sc) && sc.length && Array.isArray(sc[0])) {\n    return sc.map(function(g) { var n = (g && g[0]) || {}; return { level: n.level || '', levelName: n.levelName || n.level || '' }; }).filter(function(x) { return x.level; });\n  }\n  var seen = {}, out = [];\n  m.listTables().forEach(function(t) { var lv = String(t.get('level') || ''); if (lv && !seen[lv]) { seen[lv] = 1; out.push({ level: lv, levelName: lv }); } });\n  return out;\n}\nfunction levelName(lv) { var nm = lv; docLevels().forEach(function(L) { if (L.level === String(lv)) nm = L.levelName; }); return nm; }\nfunction tablesOfLevel(lv) { var m = host.docMeta; return m ? m.listTables().filter(function(t) { return String(t.get('level') || '') === String(lv); }) : []; }\nfunction curLevel() { var s = root.querySelector('#docLevelSel'); return s ? s.value : ''; }\nfunction renderDocTable() {\n  var m = host.docMeta; if (!m) return;\n  var s = root.querySelector('#docTableSel');\n  var t = (s && m.getTable(s.value)) || tablesOfLevel(curLevel())[0] || null;\n  if (!t) { setText('docPanelTitle', '层表（无）'); setText('docTableInfo', ''); renderFields('docFields', []); return; }\n  setText('docPanelTitle', '层表：' + t.name + '（' + (t.get('tableName') || t.id) + '） · ' + (t.get('level') || '') + ' ' + levelName(t.get('level')));\n  setText('docTableInfo', t.listFieldRefs().length + ' 字段');\n  renderFields('docFields', t.listFieldRefs());\n}\nfunction renderDocLevel() {\n  var lv = curLevel(), tbls = tablesOfLevel(lv);\n  fillSel('docTableSel', tbls, function(t) { return t.id; }, function(t) { return t.name + '（' + (t.get('tableName') || t.id) + '）'; }, tbls[0] ? tbls[0].id : '');\n  renderDocTable();\n}\n/* 从已装载的模型实例填充三个下拉、设默认、首次渲染、绑定 onchange（幂等，不叠加监听） */\nfunction buildPickers() {\n  var dctM = host.dctMeta, docM = host.docMeta;\n  if (!dctM || !docM) return;\n  var dctTbl = dctM.getTable('gl_account') || dctM.listTables()[0] || null;\n  if (dctTbl) fillSel('dctSel', [dctTbl], function(t) { return t.id; }, function(t) { return t.name + '（' + t.id + '）'; }, dctTbl.id);\n  renderDct();\n  var lvls = docLevels();\n  fillSel('docLevelSel', lvls, function(L) { return L.level; }, function(L) { return L.levelName + '（' + L.level + '）'; }, lvls[0] ? lvls[0].level : '');\n  renderDocLevel();\n  var ls = root.querySelector('#docLevelSel'); if (ls) ls.onchange = renderDocLevel;\n  var ts = root.querySelector('#docTableSel'); if (ts) ts.onchange = renderDocTable;\n}\nstatus.textContent = '加载中...';\nif (debug) debug.textContent = '';\n/* 数据已在 host.dctMeta / host.docMeta 时（之前已加载过），直接用内存渲染，不再请求后端 */\nif (!mode && host.dctMeta && host.dctMeta.listTables && host.dctMeta.listTables().length && host.docMeta && host.docMeta.listTables().length) {\n  /* 自动进入（initPage / onActivate）且数据已在模型实例中 → 纯内存渲染，绝不访问后端。\n     fetch / serviceFn 按钮显式传 mode，仍走真实加载（演示两种方式）。 */\n  buildPickers();\n  setText('viaText', '本次加载方式：内存（数据已在 CmxDCTMeta / CmxDOCMeta，未访问后端）');\n  status.textContent = '已就绪 · 内存（未访问后端）';\n  return;\n}\nwaitForLib().then(function(lib) {\n  var dctMeta = host.dctMeta, docMeta = host.docMeta;\n  if (!dctMeta || !docMeta) { throw new Error('模型面板未声明 dctMeta / docMeta 实例（请在模型面板添加 CmxDCTMeta、CmxDOCMeta）'); }\n  var useService = (mode !== 'fetch');\n  var opts = useService ? { host: host, serviceFn: 'loadDefinitionsBatch' } : { host: host };\n  return lib.loadMetaModelsBatch({ dctMeta: dctMeta, docMeta: docMeta }, opts);\n}).then(function(bundle) {\n  if (bundle.errors && bundle.errors.length) { throw new Error('批量加载存在错误: ' + JSON.stringify(bundle.errors)); }\n  var dct = host.dctMeta, doc = host.docMeta;\n  if (!dct || !doc) { throw new Error('批量装载后 dctMeta 或 docMeta 仍为空'); }\n  var dctSummary = dct.getSummary();\n  var docSummary = doc.getSummary();\n  setText('dctFieldSets', dctSummary.fieldSets);\n  /* 数据已在 host.dctMeta / host.docMeta；三个下拉与字段表全部从内存渲染，切换下拉不再访问后端 */\n  buildPickers();\n  if (debug) debug.textContent = JSON.stringify({\n    loadMode: '模型面板声明 dctMeta/docMeta → loadMetaModelsBatch 经服务面板服务 loadDefinitionsBatch 单次 POST /api/definitions/batch 就地灌入既有实例；下拉切换纯内存读取，不再请求后端',\n    loadVia: bundle.via,\n    backendPaths: { dctMeta: (dct.backendPath || dct.backendRelPath || ''), docMeta: (doc.backendPath || doc.backendRelPath || ''), bases: (bundle.basePaths || {}) },\n    dctSummary: dctSummary,\n    docSummary: docSummary,\n    dictionaries: dct.listTables().map(function(t) { return t.id; }),\n    docLevels: docLevels().map(function(L) { return L.level + ':' + L.levelName; }),\n    errors: bundle.errors\n  }, null, 2);\n  var viaMap = { 'fetch': '库内 fetch（fetchDefinitionsBatch 直连）', 'resolver': '自定义 resolver', 'service:loadDefinitionsBatch': '服务面板服务（serviceFn: loadDefinitionsBatch）' };\n  var viaLabel = viaMap[bundle.via] || ('服务面板服务（' + bundle.via + '）');\n  var dctPathHint = dct.backendRelPath || dct.backendPath || '';\n  setText('viaText', '本次加载方式：' + viaLabel + (dctPathHint ? '　·　DCT 后端路径：' + dctPathHint : ''));\n  status.textContent = '加载完成 · ' + viaLabel;\n}).catch(function(e) {\n  status.textContent = '加载失败';\n  if (debug) debug.textContent = e && e.stack ? e.stack : String(e && e.message || e);\n});","readsVars":[],"writesVars":[]}],"pageServices":[{"name":"loadDefinitionsBatch","type":"rest","url":"/api/definitions/batch","method":"POST","rpcMethod":"","gqlOperationName":"","gqlQuery":"","headers":"","bodyTemplate":"","responseTo":"","responseTransform":""}],"pageDeps":[],"pageInterfaces":[{"name":"initPage","enabled":true,"body":"if (host.loadMetaModels) host.loadMetaModels();"},{"name":"onActivate","enabled":true,"body":"if (!host.__metaActivated) { host.__metaActivated = true; if (host.loadMetaModels) host.loadMetaModels(); }"},{"name":"isDirty","enabled":true,"body":"return false;"},{"name":"getState","enabled":true,"body":"return { dct: host.dctMeta ? host.dctMeta.getSummary() : null, doc: host.docMeta ? host.docMeta.getSummary() : null }; "},{"name":"validate","enabled":true,"body":"return { valid: true };"}],"dataSources":[],"dataFlow":{"schema":[],"aggregations":[],"relations":[]},"models":[{"modelType":"CmxDCTMeta","instanceId":"dctMeta","props":{"domain":"fi","application":"cmxfico","module":"gl","id":"gl_account","autoLoad":false}},{"modelType":"CmxDOCMeta","instanceId":"docMeta","props":{"domain":"fi","application":"cmxfico","module":"gl","id":"gl_md","autoLoad":false}}]}</script>
