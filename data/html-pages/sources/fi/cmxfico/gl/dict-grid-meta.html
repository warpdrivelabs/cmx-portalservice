<div style="display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:10px;gap:10px;background:var(--sapBackgroundColor,#f7f7f7);color:var(--sapTextColor,#1d2d3e);">
  <ui5-bar design="Header" accessible-role="Toolbar">
    <ui5-label slot="startContent" wrapping-type="Normal" style="font-weight:800;font-size:1.05rem;">数据字典元数据 · 动态列字典内容</ui5-label>
    <ui5-label id="statusText" slot="endContent" wrapping-type="Normal" style="font-size:0.8rem;color:var(--sapContent_LabelColor);">等待加载</ui5-label>
    <ui5-button slot="endContent" design="Transparent" icon="download" data-eventclick="loadDictMeta('fetch');">元数据(fetch)</ui5-button>
    <ui5-button slot="endContent" design="Emphasized" icon="connected" data-eventclick="loadDictMeta('service');">元数据(service)</ui5-button>
  </ui5-bar>

  <div style="display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--sapInformationBackground,#eaf4ff);border:1px solid var(--sapInformationBorderColor,#bcd8f7);border-radius:4px;">
    <ui5-icon name="information" style="color:var(--sapInformationColor,#0a6ed1);"></ui5-icon>
    <ui5-label id="viaText" wrapping-type="Normal" style="font-weight:700;font-size:0.85rem;">点上方按钮加载 DCT 元数据（批量：一次取回字典定义 + base 字段集）</ui5-label>
  </div>

  <div class="ctrl-row">
    <ui5-label style="font-weight:700;">ERP 模块：</ui5-label>
    <select id="moduleSel" class="sel" aria-label="选择 ERP 模块"></select>
    <ui5-label style="font-weight:700;margin-left:10px;">数据字典：</ui5-label>
    <select id="dictSel" class="sel" aria-label="选择数据字典"></select>
    <ui5-button design="Transparent" icon="refresh" data-eventclick="selectDict();">刷新内容</ui5-button>
    <ui5-label id="rowCountText" wrapping-type="Normal" style="color:var(--sapContent_LabelColor,#6a6d70);font-size:0.82rem;">—</ui5-label>
    <span style="flex:1 1 auto;"></span>
    <ui5-button id="batchBtn" design="Attention" icon="multiselect-all" data-eventclick="batchLoadAll();">批量加载全部字典内容</ui5-button>
  </div>

  <section class="panel" style="flex:1 1 auto;min-height:0;">
    <div class="panel-head">
      <ui5-icon name="grid"></ui5-icon>
      <ui5-title id="dictTitle" level="H5" size="H5">字典内容</ui5-title>
      <span style="flex:1 1 auto;"></span>
      <ui5-label wrapping-type="Normal" style="font-size:0.76rem;color:var(--sapContent_LabelColor);">列由元数据动态生成 · 数据动态加载</ui5-label>
    </div>
    <cmx-revo-grid id="dictGrid" data-cmx-model-id="dictColumnModel" data-cmx-dataset-id="dictDataSet" style="display:block;width:100%;flex:1 1 0%;min-height:0;"></cmx-revo-grid>
  </section>

  <section class="panel" style="flex:0 0 230px;min-height:0;">
    <div class="panel-head">
      <ui5-icon name="multiselect-all"></ui5-icon>
      <ui5-title level="H5" size="H5">多字典批量加载汇总</ui5-title>
      <span style="flex:1 1 auto;"></span>
      <ui5-label id="batchInfo" wrapping-type="Normal" style="font-size:0.78rem;color:var(--sapContent_LabelColor);">点「批量加载全部字典内容」一次性并行加载</ui5-label>
    </div>
    <cmx-revo-grid id="batchGrid" data-cmx-model-id="batchColumnModel" data-cmx-dataset-id="batchDataSet" style="display:block;width:100%;flex:1 1 0%;min-height:0;"></cmx-revo-grid>
  </section>

  <style>
    .ctrl-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sapTile_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#d9d9d9);border-radius:4px}
    .sel{min-width:240px;box-sizing:border-box;padding:5px 7px;border:1px solid var(--sapField_BorderColor,#b3b3b3);border-radius:4px;background:var(--sapField_Background,#fff);color:var(--sapField_TextColor,#1d2d3e);font-size:0.85rem}
    .panel{background:var(--sapList_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#d9d9d9);border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
    .panel-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--sapGroup_ContentBorderColor,#d9d9d9);background:var(--sapList_HeaderBackground,#f5f6f7)}
    .panel-head ui5-title{margin:0}
  </style>
</div>
<script type="application/json" id="__designer_meta__">{"pageData":[],"pageFns":[{"name":"loadModules","params":"","body":"\n\nvar lib = globalThis.__cmxDataComp || host.__cmxClasses;\nvar root = host.shadowRoot;\nfunction $(id){ return root.querySelector('#'+id); }\nfunction setText(id,v){ var el=$(id); if(el) el.textContent=(v==null?'':String(v)); }\nfunction esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }\nfunction waitForLib(){\n  return new Promise(function(resolve,reject){\n    var n=0, t=setInterval(function(){\n      var L=globalThis.__cmxDataComp;\n      if(L && typeof L.loadMetaModelsBatch==='function' && L.CmxColumn && L.CmxColumnModel){ clearInterval(t); resolve(L); return; }\n      if(++n>120){ clearInterval(t); reject(new Error('cmx-data-comp 未就绪（loadMetaModelsBatch/CmxColumn/CmxColumnModel）')); }\n    },50);\n  });\n}\nfunction buildColumns(table){\n  var CmxColumn=lib.CmxColumn;\n  var refs=table.listFieldRefs();\n  return refs.map(function(ref){\n    var f=ref.field||{};\n    var id=ref.id||f.id||f.name||'';\n    var w = id==='id'?'90px' : id==='code'?'120px'\n          : id==='name'?'180px'\n          : (/time|date|_at$/.test(id))?'160px' : '140px';\n    return new CmxColumn({ id:id, caption:(f.caption!=null?f.caption:id), dataType:(f.dataType||'VARCHAR'), width:w });\n  });\n}\nvar DICT_PREFIX = { gl:'', fico:'sap_', ebs:'ebs_', yonyou:'yy_', kingdee:'kd_' };\nfunction contentDictId(code){\n  var pfx = DICT_PREFIX[host.__curModule] || '';\n  return pfx + code;\n}\n/* 字典内容装载（旧 dict 服务已下线 → dct 数据服务）：\n   按当前模块的 DAM 坐标（__moduleRefs，来自 definitions/list）+ 字典码定位；\n   响应解包 ApiResp 信封；code!=0（未注册/未命中）按旧 404 语义降级为 __noSource。 */\nfunction fetchDictRows(dictCode, pageSize){\n  var mod=host.__curModule||'gl';\n  var ref=(host.__moduleRefs&&host.__moduleRefs[mod])||{};\n  var qs='dict='+encodeURIComponent(dictCode);\n  if(ref.domain)qs+='&domain='+encodeURIComponent(ref.domain);\n  if(ref.application)qs+='&application='+encodeURIComponent(ref.application);\n  if(ref.module)qs+='&module='+encodeURIComponent(ref.module);\n  if(ref.id)qs+='&file='+encodeURIComponent(ref.id);\n  return fetch('/api/dct/data/search?'+qs,{\n    method:'POST', headers:{'Content-Type':'application/json'},\n    body:JSON.stringify({ pageSize:(pageSize||500), page:1 })\n  }).then(function(res){\n    if(res.status===404) return { __noSource:true, rows:[], total:0 };\n    if(!res.ok) throw new Error('字典内容加载失败 HTTP '+res.status+'（'+dictCode+'）');\n    return res.json();\n  }).then(function(j){\n    if(j&&j.code!==0&&j.code!=null) return { __noSource:true, rows:[], total:0 };\n    var rows=(j&&((j.data&&j.data.rows)||j.rows))||[];\n    return { rows:rows, total:(j&&j.data&&j.data.total)||rows.length };\n  });\n}\n/* 旧字典批量端点已下线：批量装载改为并行单字典查询，\n   结果仍按 contentDictId 前缀码作键、错误进 errors，与原响应结构一致。 */\nfunction batchLoadDictRows(codes, pageSize){\n  var results={}, errors=[];\n  return Promise.all((codes||[]).map(function(code){\n    return fetchDictRows(code, pageSize).then(function(data){\n      if(data&&data.__noSource){ errors.push({ dictId:contentDictId(code), error:'未注册数据源' }); return; }\n      results[contentDictId(code)]={ rows:data.rows||[] };\n    }).catch(function(e){ errors.push({ dictId:contentDictId(code), error:(e&&e.message)||String(e) }); });\n  })).then(function(){ return { results:results, errors:errors }; });\n}\n\nfetch('/api/definitions/list?kind=DCT&domain=fi').then(function(res){ return res.json(); }).then(function(data){\n  var items=(data&&data.items)||[];\n  host.__moduleRefs={};\n  /* 单表缓存：dictCode -> { table, mod }，避免切回同一字典时重复请求单表元数据 */\n  host.__dictTableCache = host.__dictTableCache || {};\n  var sel=$('moduleSel');\n  if(sel){\n    sel.innerHTML=items.map(function(it){\n      host.__moduleRefs[it.module]={ domain:it.domain, application:it.application, module:it.module, id:it.file, title:it.title, dictionaries:(it.dictionaries||[]) };\n      var dictCnt=(it.dictionaries&&it.dictionaries.length)|| (it.tableCount||0);\n      return '<option value=\"'+esc(it.module)+'\">'+esc((it.title||it.module)+'（'+it.module+'·'+dictCnt+'表）')+'</option>';\n    }).join('');\n    var def = host.__moduleRefs['gl'] ? 'gl' : (items[0]?items[0].module:'');\n    if(def) sel.value=def;\n    sel.onchange=function(){ host.loadDictMeta(); };\n  }\n  setText('statusText','模块已就绪 · '+items.length+' 套字典');\n  host.loadDictMeta();\n}).catch(function(e){ setText('statusText','模块列表加载失败：'+(e&&e.message||e)); });\n\n","readsVars":[],"writesVars":[]},{"name":"loadDictMeta","params":"mode","body":"\n\nvar lib = globalThis.__cmxDataComp || host.__cmxClasses;\nvar root = host.shadowRoot;\nfunction $(id){ return root.querySelector('#'+id); }\nfunction setText(id,v){ var el=$(id); if(el) el.textContent=(v==null?'':String(v)); }\nfunction esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }\nfunction waitForLib(){\n  return new Promise(function(resolve,reject){\n    var n=0, t=setInterval(function(){\n      var L=globalThis.__cmxDataComp;\n      if(L && typeof L.loadMetaModelsBatch==='function' && L.CmxColumn && L.CmxColumnModel){ clearInterval(t); resolve(L); return; }\n      if(++n>120){ clearInterval(t); reject(new Error('cmx-data-comp 未就绪（loadMetaModelsBatch/CmxColumn/CmxColumnModel）')); }\n    },50);\n  });\n}\nfunction buildColumns(table){\n  var CmxColumn=lib.CmxColumn;\n  var refs=table.listFieldRefs();\n  return refs.map(function(ref){\n    var f=ref.field||{};\n    var id=ref.id||f.id||f.name||'';\n    var w = id==='id'?'90px' : id==='code'?'120px'\n          : id==='name'?'180px'\n          : (/time|date|_at$/.test(id))?'160px' : '140px';\n    return new CmxColumn({ id:id, caption:(f.caption!=null?f.caption:id), dataType:(f.dataType||'VARCHAR'), width:w });\n  });\n}\nvar DICT_PREFIX = { gl:'', fico:'sap_', ebs:'ebs_', yonyou:'yy_', kingdee:'kd_' };\nfunction contentDictId(code){\n  var pfx = DICT_PREFIX[host.__curMod oduleRefs&&host.__moduleRefs[mod])|| { domain:'fi', application:'cmxfico', module:'gl', id:'gl_md_dct_meta_v1.json', dictionaries:[] };\n/* 切模块：清状态。dictionaries 清单从 list 接口的 ref 拿，元数据延迟到 selectDict 按选中 dictCode 单表加载 */\nhost.__dictMetaReady=false; host.__curModule=mod;\nif(host.dictMS && typeof host.dictMS.setDataSet==='function'){ try{ host.dictMS.setDataSet({}); }catch(e){} }\nhost.__dictMSModule=null;\nvar dicts=(ref.dictionaries||[]).map(function(d){ return { dictCode:d.dictCode, dictName:d.dictName }; });\nvar sel=$('dictSel');\nif(sel){\n  sel.innerHTML=dicts.map(function(d){ return '<option value=\"'+esc(d.dictCode)+'\">'+esc((d.dictName||d.dictCode)+'（'+d.dictCode+'）')+'</option>'; }).join('');\n  /* 默认选 gl_account（无则第一个） */\n  var defDict='gl_account';\n  var hasDef=dicts.some(function(d){ return d.dictCode===defDict; });\n  if(!hasDef && dicts.length){ defDict=dicts[0].dictCode; }\n  if(defDict) sel.value=defDict;\n  sel.onchange=function(){ host.selectDict(); };\n}\nvar modTitle=ref.title||mod;\nsetText('viaText','当前模块：'+modTitle+'（'+mod+'）　·　字典数：'+dicts.length+'（按 dictCode 单表加载）');\nsetText('statusText',modTitle+' 字典清单已就绪 · '+dicts.length+' 个字典');\nhost.__dictMetaReady=true;\n/* 切模块时清掉跨模块的单表缓存（防止 gl 的 table 被当作 fico 使用） */\nhost.__dictTableCache = {};\nhost.selectDict();\n\n","readsVars":[],"writesVars":[]},{"name":"selectDict","params":"","body":"\n\nvar lib = globalThis.__cmxDataComp || host.__cmxClasses;\nvar root = host.shadowRoot;\nfunction $(id){ return root.querySelector('#'+id); }\nfunction setText(id,v){ var el=$(id); if(el) el.textContent=(v==null?'':String(v)); }\nfunction esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }\nfunction waitForLib(){\n  return new Promise(function(resolve,reject){\n    var n=0, t=setInterval(function(){\n      var L=globalThis.__cmxDataComp;\n      if(L && typeof L.loadMetaModelsBatch==='function' && L.CmxColumn && L.CmxColumnModel){ clearInterval(t); resolve(L); (j&&j.data&&j.data.total)||rows.length };\n  });\n}\n/* 旧字典批量端点已下线：批量装载改为并行单字典查询，\n   结果仍按 contentDictId 前缀码作键、错误进 errors，与原响应结构一致。 */\nfunction batchLoadDictRows(codes, pageSize){\n  var results={}, errors=[];\n  return Promise.all((codes||[]).map(function(code){\n    return fetchDictRows(code, pageSize).then(function(data){\n      if(data&&data.__noSource){ errors.push({ dictId:contentDictId(code), error:'未注册数据源' }); return; }\n      results[contentDictId(code)]={ rows:data.rows||[] };\n    }).catch(function(e){ errors.push({ dictId:contentDictId(code), error:(e&&e.message)||String(e) }); });\n  })).then(function(){ return { results:results, errors:errors }; });\n}\n\nif(!host.__dictMetaReady){ return; }\nvar modSel=$('moduleSel');\nvar mod=(modSel&&modSel.value)|| host.__curModule || 'gl';\nvar modRef=(host.__moduleRefs&&host.__moduleRefs[mod])||{ domain:'fi', application:'cmxfico', module:'gl' };\nvar dicts=(modRef.dictionaries)||[];\nvar sel=$('dictSel');\nvar code=(sel&&sel.value)|| (dicts[0]&&dicts[0].dictCode) ||'';\nvar grid=$('dictGrid');\nvar colModel=host.dictColumnModel, ds=host.dictDataSet;\nif(!code||!grid){ return; }\nif(!colModel||!ds){ alert('页面模型未就绪：请在模型面板声明 dictColumnModel(CmxColumnModel) 与 dictDataSet(CmxDataSet)'); return; }\nhost.__curModule=mod;\nsetText('rowCountText','加载元数据中（'+code+'）...');\n/* 单表缓存：命中即复用，避免每次切字典都请求后端 */\nhost.__dictTableCache = host.__dictTableCache || {};\nfunction applyTable(table){\n  var cols=buildColumns(table);\n  colModel.datasetId='dict.'+code;\n  colModel.setMembers(cols);\n  grid.setColumnModel(colModel);\n  grid.setOptions({ selectionMode:'single', fillHeight:true, showRowIndex:true, editable:false });\n  setText('dictTitle', table.name+'（'+code+'）');\n  var msDs = (host.__dictMSModule===host.__curModule && host.dictMS && typeof host.dictMS.getRootDataSet==='function')\n    ? host.dictMS.getRootDataSet(code) : null;\n  if(msDs){\n    grid.setDataSet(msDs);\n    setText('rowCountText','列：'+cols.length+' · 行：'+msD
