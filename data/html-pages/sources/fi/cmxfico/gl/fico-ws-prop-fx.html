<script type="application/json" id="__designer_meta__">{"pageData":[],"pageFns":[],"pageServices":[],"pageDeps":[],"pageInterfaces":[{"name":"initPage","enabled":true,"body":"\nvar LEVELS=['batch','headers','account_lines','aux_lines'];\nvar root=host.shadowRoot;\nfunction $(s){return root.querySelector(s);}\nfunction setText(id,v){var e=$('#'+id); if(e)e.textContent=(v==null?'':String(v));}\nfunction fmt(x){var n=+x||0;return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}\nvar lib=globalThis.__cmxDataComp||host.__cmxClasses;\nfunction modelHost(){ try{ return host.workspace&&host.workspace.pageview&&host.workspace.pageview['fico-ws-model']||null; }catch(e){ return null; } }\nfunction getMS(){ var m=modelHost(); return m&&m.voucherMS||null; }\nfunction ctx(){ try{ return host.workspace&&host.workspace.context||null; }catch(e){ return null; } }\nfunction fireModelReady(kind){ try{ window.dispatchEvent(new CustomEvent('cmx-fico-model',{detail:{kind:kind}})); }catch(e){} }\n/* 一次性等就绪:kind='meta'(列模型就绪) | 'data'(第1张凭证装入)。先查标志命中即同步回调,否则监听事件+长间隔兜底。 */\nfunction onModelReady(kind, cb){\n  function hit(m){ if(!m) return false; return kind==='meta' ? m.__metaReady : m.__ready; }\n  var m=modelHost(); if(hit(m)){ cb(m); return; }\n  function h(ev){ var mm=modelHost(); if(hit(mm)){ window.removeEventListener('cmx-fico-model', h); cb(mm); } }\n  window.addEventListener('cmx-fico-model', h);\n  var n=0,t=setInterval(function(){ var mm=modelHost(); if(hit(mm)){ clearInterval(t); window.removeEventListener('cmx-fico-model',h); cb(mm); } if(++n>120){clearInterval(t);} },80);\n}\n/* 持续订阅 model 生命周期事件:kind='page'(批列表页变化) | 'voucher'(当前凭证变化)。纯订阅,不查标志。 */\nfunction onModelEvent(kind, cb){ window.addEventListener('cmx-fico-model', function(ev){ if(ev&&ev.detail&&ev.detail.kind===kind) cb(modelHost()); }); }\n\nfunction fillFromHeader(h){ if(!h)return;\n  setText('fxDoc',h.doc_currency_code||'—'); setText('fxGrp',h.group_currency_code||'—');\n  setText('fxRate',h.exchange_rate!=null?h.exchange_rate:'—'); setText('fxGRate',h.group_rate!=null?h.group_rate:'—');\n  setText('fxEnt',fmt(h.entered_dr)+' / '+fmt(h.entered_cr));\n  setText('fxLoc',fmt(h.local_dr)+' / '+fmt(h.local_cr));\n  setText('fxGrpAmt',fmt(h.group_dr)+' / '+fmt(h.group_cr));\n}\n/* 行标签统一取元数据 caption(headers 层);借/贷合并行用「借方字段 caption + ' / 贷方'」拼,仍以元数据为准。 */\nfunction dcLabel(m,drId,crId){ var d=m.capOf('headers',drId)||drId; return d.replace(/借方$/,'借/贷'); }\nfunction fillLabels(m){\n  setText('lblDoc', m.capOf('headers','doc_currency_code'));\n  setText('lblGrp', m.capOf('headers','group_currency_code'));\n  setText('lblRate', m.capOf('headers','exchange_rate'));\n  setText('lblGRate', m.capOf('headers','group_rate'));\n  setText('lblEnt', dcLabel(m,'entered_dr','entered_cr'));\n  setText('lblLoc', dcLabel(m,'local_dr','local_cr'));\n  setText('lblGrpAmt', dcLabel(m,'group_dr','group_cr'));\n}\nsetText('statusText','等待模型...');\nonModelReady('data', function(m){\n  var ms=m.voucherMS;\n  if(m.capOf) fillLabels(m);   /* 字段名来自元数据 */\n  function cur(){ try{ var ds=ms._resolveWrap?ms._resolveWrap('batch.headers'):null; return ds&&ds.currentRow; }catch(e){return null;} }\n  function refresh(){ var h=cur(); fillFromHeader(h&&h.toPlainObject?h.toPlainObject():h); }\n  var c=ctx(); if(c){ c.on('change', function(e){ if(e.key==='currentVoucherId'||e.key==='currentBatchId'||e.key==='currentLine'){ setTimeout(refresh,60); } }); }\n  /* 每次切换凭证后头层 ds 实例已换 → 用 onModelEvent 重新读当前头(不依赖 stale 监听) */\n  onModelEvent('voucher', function(){ setTimeout(refresh,60); });\n  refresh();\n  setText('statusText','外币联动就绪');\n});\n"},{"name":"getPageApi","enabled":true,"body":"return {};"},{"name":"isDirty","enabled":true,"body":"return false;"}],"dataSources":[],"dataFlow":{"schema":[],"aggregations":[],"relations":[]},"models":[]}</script>
