<script type="application/json" id="__designer_meta__">{"pageData":[],"pageFns":[],"pageServices":[{"name":"loadAcctData","type":"rest","url":"/api/dct/data/search?domain=fi&application=cmxfico&module=gl&dict=gl_account&file=cmxfico_dct_meta_v3.json","method":"POST","rpcMethod":"","gqlOperationName":"","gqlQuery":"","headers":"{\"db_id\":\"fico-db\"}","bodyTemplate":"","responseTo":"","responseTransform":""},{"name":"loadOrgData","type":"rest","url":"/api/dct/data/search?domain=fi&application=cmxfico&module=gl&dict=cons_org&file=cmxfico_dct_meta_v3.json","method":"POST","rpcMethod":"","gqlOperationName":"","gqlQuery":"","headers":"{\"db_id\":\"fico-db\"}","bodyTemplate":"","responseTo":"","responseTransform":""}],"pageDeps":[],"pageInterfaces":[{"name":"initPage","enabled":true,"body":"\nvar root=host.shadowRoot;\nfunction $(s){return root.querySelector(s);}\nfunction $all(s){return Array.prototype.slice.call(root.querySelectorAll(s));}\nfunction setText(id,v){var e=$('#'+id); if(e)e.textContent=(v==null?'':String(v));}\nfunction fmtAmt(x){var n=+x||0;return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}\nvar lib=globalThis.__cmxDataComp||host.__cmxClasses;\nfunction modelHost(){ try{ return host.workspace&&host.workspace.pageview&&host.workspace.pageview['acctws-model']||null; }catch(e){ return null; } }\nfunction ctx(){ try{ return host.workspace&&host.workspace.context||null; }catch(e){ return null; } }\nfunction fireModelReady(kind){ try{ window.dispatchEvent(new CustomEvent('cmx-acctws-model',{detail:{kind:kind}})); }catch(e){} }\nfunction fireModelEvent(kind, extra){ try{ var d={kind:kind}; extra=extra||{}; for(var k in extra)d[k]=extra[k]; window.dispatchEvent(new CustomEvent('cmx-acctws-model',{detail:d})); }catch(e){} }\n/* 一次性等就绪:kind='meta'(列模型就绪) | 'data'(科目+组织数据装入)。命中即同步回调,否则监听事件 + 长间隔兜底。 */\nfunction onModelReady(kind, cb){\n  function hit(m){ if(!m) return false; return kind==='meta' ? m.__metaReady : m.__ready; }\n  var m=modelHost(); if(hit(m)){ cb(m); return; }\n  function h(ev){ var mm=modelHost(); if(hit(mm)){ window.removeEventListener('cmx-acctws-model', h); cb(mm); } }\n  window.addEventListener('cmx-acctws-model', h);\n  var n=0,t=setInterval(function(){ var mm=modelHost(); if(hit(mm)){ clearInterval(t); window.removeEventListener('cmx-acctws-model',h); cb(mm); } if(++n>120){clearInterval(t);} },80);\n}\nfunction onModelEvent(kind, cb){ window.addEventListener('cmx-acctws-model', function(ev){ if(ev&&ev.detail&&ev.detail.kind===kind) cb(modelHost(), ev.detail); }); }\n\nvar ACCT_TYPES=[{\"code\":\"A\",\"label\":\"资产\",\"icon\":\"money-bills\",\"role\":\"asset\"},{\"code\":\"D\",\"label\":\"负债\",\"icon\":\"credit-card\",\"role\":\"liability\"},{\"code\":\"K\",\"label\":\"权益\",\"icon\":\"capital-projects\",\"role\":\"equity\"},{\"code\":\"S\",\"label\":\"收入\",\"icon\":\"sales-order\",\"role\":\"revenue\"},{\"code\":\"P\",\"label\":\"支出\",\"icon\":\"receipt\",\"role\":\"expense\"},{\"code\":\"M\",\"label\":\"物料\",\"icon\":\"supplier\",\"role\":\"material\"}];\nvar ACCT_DICT='cf_gl_account', ORG_DICT='cf_cons_org';\nsetText('statusText','加载共享模型...');\n\n/* 科目行归一:cf_gl_account 主键是 code、parent_id 引用父 code;把 code 写入 id 让组件默认 id 语义建树 */\nfunction isLeaf(r){ var v=r.is_leaf; return v===true||v===1||v==='1'||String(v).toLowerCase()==='true'; }\nvar TYPE_TEXT={A:'资产',D:'负债',K:'权益',S:'收入',P:'支出',M:'物料'};\nvar ICON_BY_TYPE={A:'money-bills',D:'credit-card',K:'capital-projects',S:'sales-order',P:'receipt',M:'supplier'};\nfunction pickAcctIcon(r,leaf,t){\n  var txt=(String(r.name||'')+' '+String(r.code!=null?r.code:r.id||'')).toLowerCase();\n  var rules=[['库存现金','money-bills'],['现金','money-bills'],['银行存款','official-service'],['银行','official-service'],['应收','customer'],['预收','sales-order'],['应付','supplier'],['预付','batch-payments'],['存货','inventory'],['库存','inventory'],['原材料','inventory'],['产成品','product'],['固定资产','machine'],['折旧','refresh'],['无形','document-text'],['投资','capital-projects'],['借款','loan'],['贷款','loan'],['股本','capital-projects'],['资本公积','capital-projects'],['工资','employee'],['薪酬','employee'],['社保','employee'],['福利','employee'],['增值税','receipt'],['所得税','receipt'],['税金','receipt'],['税费','receipt'],['收入','sales-order'],['销售','sales-order'],['营业外','lead'],['费用','receipt'],['差旅','travel-expense'],['办公','receipt'],['制造费用','supplier'],['生产成本','supplier'],['成本','supplier'],['研发','project-definition-triangle-2'],['项目','project-definition-triangle-2'],['汇兑','currency'],['外币','currency'],['长期','history'],['短期','history'],['房屋','home'],['土地','home']];\n  for(var i=0;i<rules.length;i++){ if(txt.indexOf(rules[i][0])>=0) return rules[i][1]; }\n  return leaf?(ICON_BY_TYPE[t]||'document-text'):(ICON_BY_TYPE[t]||'folder'); }\nfunction acctNode(r){ var leaf=isLeaf(r); var t=r.account_type_code||r.account_type||''; var code=r.code!=null?String(r.code):String(r.id||''); var parent=r.parent_id==null?'':String(r.parent_id); var key=[t,code].filter(Boolean).join(':');\n  return { id:key||code, code:code, acct_code:code, parent_id:parent?([t,parent].filter(Boolean).join(':')):'', parent_code:parent, name:r.name,\n    account_type_code:t, account_type_text:TYPE_TEXT[t]||t,\n    pl_bs_flag:r.pl_bs_flag||'', account_currency_code:r.account_currency_code||'',\n    level_no:r.level_no, is_leaf:r.is_leaf, is_leaf_text:leaf?'是':'否',\n    icon: pickAcctIcon(r,leaf,t) }; }\n/* 组织行归一(树用) */\nfunction orgNode(r){ var code=r.code!=null?String(r.code):String(r.id); var parent=r.parent_id==null?'':String(r.parent_id);\n  var o=Object.assign({},r); o.code=code; o.id=o.id!=null?o.id:code; o.parent_id=r.parent_id;\n  o.displayValue=[code,r.name].filter(Boolean).join(' ');\n  if(!o.full_path) o.full_path=parent?(parent+'.'+code):code;\n  if(!o.level_no) o.level_no=String(o.full_path).split('.').length;\n  o.icon=isLeaf(r)?'org-chart':'building';\n  return o; }\n\n/* 数据访问层:走 pageService(POST) */\nfunction fiscalParams(){ var p=host.__fiscalPeriod||''; var q={ pageSize:9999 }; if(p){ q.period=p; q.fiscalPeriod=p; } return q; }\nfunction loadAccts(){ return host.loadAcctData({ pageSize:9999 }); }\nfunction loadOrgs(){ return host.loadOrgData(fiscalParams()); }\nhost.getFiscalPeriod=function(){ return host.__fiscalPeriod||''; };\nhost.setFiscalPeriod=function(period){\n  host.__fiscalPeriod=period||'';\n  var c=ctx(); if(c){ c.set('fiscalPeriod', host.__fiscalPeriod); c.set('currentFiscalPeriod', host.__fiscalPeriod); }\n  setText('statusText','加载组织 '+(host.__fiscalPeriod||'')+'...');\n  return loadOrgs().then(function(d){ applyOrgs((d&&((d.data&&d.data.rows)||d.rows||d.hits))||[]); setText('statusText','组织 '+(host.__fiscalPeriod||'')+' '+(host.__orgRows.length)+' 个'); return host.__orgRows; }).catch(function(e){ setText('statusText','组织加载失败:'+(e&&e.message||e)); return []; });\n};\nhost.reloadOrgs=function(){ return host.setFiscalPeriod(host.__fiscalPeriod||''); };\n\n/* 科目:全量装入 acctMS;按类型派生 6 个过滤视图(零拷贝 live 视图),各 tab 的 treegrid 绑一个 */\nhost.__acctRows=[];\nhost.acctView=function(typeCode){ return (host.__acctViews&&host.__acctViews[typeCode])||null; };\nhost.getAcctRows=function(){ return host.__acctRows||[]; };\nhost.acctSummary=function(){\n  /* 按类型汇总:每类型取「该类型的根级科目」期末数模拟值(此处无余额,统计科目个数+末级数,等式用占位金额) */\n  var by={A:0,D:0,K:0,S:0,P:0,M:0}, leafBy={A:0,D:0,K:0,S:0,P:0,M:0};\n  (host.__acctRows||[]).forEach(function(r){ var t=r.account_type_code; if(by[t]!=null){ by[t]++; if(isLeaf(r))leafBy[t]++; } });\n  return { count:by, leaf:leafBy };\n};\nfunction applyAccts(rows){\n  var ms=host.acctMS; if(!ms)return;\n  host.__acctRows=(rows||[]).map(acctNode);\n  ms.setFlatData({ acct: host.__acctRows });\n  var master=ms.getRootDataSet&&ms.getRootDataSet('acct');\n  host.__acctViews=host.__acctViews||{};\n  if(master&&master.createView){\n    ACCT_TYPES.forEach(function(t){\n      var pred=(function(code){ return function(r){ return String(r.account_type_code||'')===code; }; })(t.code);\n      if(!host.__acctViews[t.code]){ host.__acctViews[t.code]=master.createView(pred,{datasetId:'acct_'+t.code,live:true}); }\n      else { master.fillView(host.__acctViews[t.code], pred, {live:true}); }\n    });\n  }\n  fireModelEvent('accts');\n}\n\n/* 组织:装入 orgMS(树用) */\nhost.__orgRows=[];\nhost.getOrgRows=function(){ return host.__orgRows||[]; };\nfunction applyOrgs(rows){\n  var ms=host.orgMS; if(!ms)return;\n  host.__orgRows=(rows||[]).map(orgNode);\n  ms.setFlatData({ org: host.__orgRows });\n  fireModelEvent('orgs');\n}\n\n/* 列模型:6 类型共用同一套科目列(treegrid),组织树用 colOrg,详情用 colDetail */\nfunction buildAcctCols(includeType){\n  function C(p){ return new lib.CmxColumn(p); }\n  var cols=[\n    C({id:'name',caption:'科目名称',dataType:'VARCHAR',width:'300px'}),\n    C({id:'acct_code',caption:'科目编码',dataType:'VARCHAR',width:'140px'}),\n  ];\n  if(includeType!==false){ cols.push(C({id:'account_type_text',caption:'类型',dataType:'VARCHAR',width:'80px'})); }\n  cols.push(C({id:'pl_bs_flag',caption:'损益/资负',dataType:'VARCHAR',width:'90px',display:{align:'center'}}),\n    C({id:'account_currency_code',caption:'币种',dataType:'VARCHAR',width:'70px',display:{align:'center'}}),\n    C({id:'level_no',caption:'层级',dataType:'INT',width:'60px',display:{align:'right'}}),\n    C({id:'is_leaf_text',caption:'末级',dataType:'VARCHAR',width:'60px',display:{align:'center'}}));\n  return cols;\n}\nfunction buildOrgCols(){ return [ new lib.CmxColumn({id:'code',caption:'编码',dataType:'VARCHAR',width:'150px'}), new lib.CmxColumn({id:'name',caption:'名称',dataType:'VARCHAR',width:'220px'}) ]; }\n\nfunction start(L){\n  var pA=loadAccts(), pO=loadOrgs();\n  /* 列模型即时可建(不依赖数据) */\n  if(host.colAcct&&host.colAcct.setMembers){ host.colAcct.setMembers(buildAcctCols(false)); host.colAcct.iconCol='icon'; }\n  if(host.colDetail&&host.colDetail.setMembers) host.colDetail.setMembers(buildAcctCols(true));\n  if(host.colOrg&&host.colOrg.setMembers) host.colOrg.setMembers(buildOrgCols());\n  host.__metaReady=true; fireModelReady('meta');\n  setText('statusText','列模型就绪,加载数据...');\n  pA.then(function(d){ applyAccts((d&&((d.data&&d.data.rows)||d.rows||d.hits))||[]); }).catch(function(e){ setText('statusText','科目加载失败:'+(e&&e.message||e)); });\n  pO.then(function(d){ applyOrgs((d&&((d.data&&d.data.rows)||d.rows||d.hits))||[]); }).catch(function(e){ setText('statusText','组织加载失败:'+(e&&e.message||e)); });\n  Promise.all([pA.catch(function(){return null;}), pO.catch(function(){return null;})]).then(function(){\n    host.__ready=true; fireModelReady('data'); fireModelEvent('accts');\n    setText('statusText','共享模型就绪:科目 '+(host.__acctRows.length)+' / 组织 '+(host.__orgRows.length));\n  });\n}\nfunction waitForLibX(cb){ var n=0,t=setInterval(function(){var L=globalThis.__cmxDataComp; if(L&&L.CmxColumn&&L.CmxDataSet&&host.acctMS&&host.orgMS){clearInterval(t);cb(L);} if(++n>200){clearInterval(t);setText('statusText','类库/模型未就绪');}},50); }\nwaitForLibX(start);\n"},{"name":"getPageApi","enabled":true,"body":"return { acctMS:host.acctMS, orgMS:host.orgMS, colAcct:host.colAcct, colOrg:host.colOrg, colDetail:host.colDetail, acctView:host.acctView, getAcctRows:host.getAcctRows, getOrgRows:host.getOrgRows, acctSummary:host.acctSummary, getFiscalPeriod:host.getFiscalPeriod, setFiscalPeriod:host.setFiscalPeriod, reloadOrgs:host.reloadOrgs, isReady:function(){return host.__ready===true;}, isMetaReady:function(){return host.__metaReady===true;} };"},{"name":"isDirty","enabled":true,"body":"return false;"}],"dataSources":[],"dataFlow":{"schema":[{"id":"acct"},{"id":"org"}],"aggregations":[],"relations":[]},"models":[{"modelType":"CmxMasterSlave","instanceId":"acctMS","props":{"schema":[{"id":"acct"}],"relations":[]}},{"modelType":"CmxMasterSlave","instanceId":"orgMS","props":{"schema":[{"id":"org"}],"relations":[]}},{"modelType":"CmxColumnModel","instanceId":"colAcct","props":{"datasetId":"acct","columns":[],"iconCol":"icon"}},{"modelType":"CmxColumnModel","instanceId":"colOrg","props":{"datasetId":"org","toTitleCols":"code,name","columns":[]}},{"modelType":"CmxColumnModel","instanceId":"colDetail","props":{"datasetId":"acct","columns":[]}}]}</script>
