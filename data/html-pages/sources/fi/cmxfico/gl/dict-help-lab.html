{\n    dictCode: cfg.dictCode,\n    idCol: 'id', labelCol: 'item_name', codeCol: 'item_code', parentCol: 'parent_id',\n    hierarchical: !!cfg.hierarchical,\n    helpLayout: cfg.helpLayout || 'grid',\n    columns: host.stdCols(),\n    dataSource: cfg.dataSource || host.makeGlDictSource(cfg.dictCode, cfg.filters),\n    classifyTreeSource: cfg.classifyTreeSource,\n    groupTreeSource: cfg.groupTreeSource,\n    dictTitle: '选择' + (cfg.label || cfg.dictCode)\n  });\n};\n\nhost.pushTimeline = function(tag, detail) {\n  host.__timeline.unshift({ tag: tag, detail: detail, at: new Date().toLocaleTimeString() });\n  if (host.__timeline.length > 14) host.__timeline.pop();\n  var box = host.shadowRoot.querySelector('#pickTimeline');\n  if (!box) return;\n  box.innerHTML = host.__timeline.map(function(t, i) {\n    var fade = 1 - i * 0.06;\n    return '<div style=\"opacity:' + fade + ';padding:6px 8px;border-left:3px solid var(--sapHighlightColor);background:var(--sapList_AlternatingBackground,transparent);border-radius:0 4px 4px 0;\"><b>' + t.at + '</b> · ' + t.tag + '<br/><span style=\"font-size:0.7rem;\">' + t.detail + '</span></div>';\n  }).join('');\n};\n\nhost.wirePickerEcho = function(el, lblId, tag) {\n  if (!el || el.__labWired) return;\n  el.__labWired = true;\n  el.addEventListener('cmx-dict-change', function(e) {\n    var d = e.detail || {};\n    var lbl = host.shadowRoot.querySelector(lblId);\n    if (d.id == null) { if (lbl) lbl.textContent = '未选择'; return; }\n    var row = d.row || {};\n    var txt = (row.item_code || '') + ' · ' + (row.item_name || d.text || d.id);\n    if (lbl) lbl.textContent = txt;\n    host.pushTimeline(tag, txt);\n  });\n};\n\nhost.renderSchemaGalaxy = function(schemas) {\n  var box = host.shadowRoot.querySelector('#schemaGalaxy');\n  var cnt = host.shadowRoot.querySelector('#schemaCountLbl');\n  if (!box) return;\n  box.innerHTML = '';\n  var list = (schemas || []).slice().sort(function(a, b) { return String(a.label || a.dictId).localeCompare(String(b.label || b.dictId)); });\n  list.forEach(function(s) {\n    var id = s.dictId || s.id;\n    var b = document.createElement('ui5-button');\n    b.textContent = (s.label || id) + (s.hierarchical ? ' ⬚' : '');\n    b.setAttribute('design', id === host.__labState.dictId ? 'Emphasized' : 'Transparent');\n    b.setAttribute('data-dict-id', id);\n    b.style.cssText = 'font-size:0.72rem;max-width:140px;';\n    b.addEventListener('click', function() { host.selectLabDict(id, s); });\n    box.appendChild(b);\n  });\n  if (cnt) cnt.textContent = list.length + ' 个字典 · data/dict/registry.json';\n};\n\nhost.selectLabDict = function(dictId, schema) {\n  host.__labState.dictId = dictId;\n  host.__labState.hierarchical = schema ? !!schema.hierarchical : GL_IDS.indexOf(dictId) >= 0;\n  var lbl = host.shadowRoot.querySelector('#labDictLbl');\n  if (lbl) lbl.textContent = (schema && schema.label) ? schema.label + ' (' + dictId + ')' : dictId;\n  host.renderSchemaGalaxy(host.__labState.schemas);\n  host.applyLabConfig();\n};\n\nhost.renderLayoutSeg = function() {\n  var box = host.shadowRoot.querySelector('#layoutSeg');\n  if (!box || box.dataset.bound) return;\n  box.dataset.bound = '1';\n  ['grid', 'classify', 'group'].forEach(function(l) {\n    var b = document.createElement('ui5-button');\n    b.textContent = l;\n    b.setAttribute('design', l === host.__labState.layout ? 'Emphasized' : 'Default');\n    b.addEventListener('click', function() {\n      host.__labState.layout = l;\n      Array.prototype.forEach.call(box.querySelectorAll('ui5-button'), function(x) {\n        x.setAttribute('design', x.textContent === l ? 'Emphasized' : 'Default');\n      });\n    });\n    box.appendChild(b);\n  });\n};\n\nhost.applyLabConfig = function() {\n  var st = host.__labState;\n  var hierSw = host.shadowRoot.querySelector('#hierSwitch');\n  if (hierSw) st.hierarchical = hierSw.checked;\n  var picker = host.shadowRoot.querySelector('#labPicker');\n  if (picker) {\n    picker.setAttribute('dict-code', st.dictId);\n    picker.setAttribute('hierarchical', st.hierarchical ? 'true' : 'false');\n    picker.setAttribute('help-layout', st.layout);\n    var schema = (host.__labState.schemas || []).find(function(s) { return (s.dictId || s.id) === st.dictId; });\n    host.configurePicker(picker, { dictCode: st.dictId, hierarchical: st.hierarchical, helpLayout: st.layout, label: schema && schema.label });\n  }\n  host.pushTimeline('配置', st.dictId + ' · layout=' + st.layout + ' · hier=' + st.hierarchical);\n};\n\nhost.setupCascadePipe = function() {\n  var e1 = host.shadowRoot.querySelector('#pipeEntity');\n  var e2 = host.shadowRoot.querySelector('#pipeAccount');\n  var e3 = host.shadowRoot.querySelector('#pipeCost');\n  host.__pipeEntityId = null;\n  host.configurePicker(e1, { dictCode: 'acct_entity', hierarchical: true, helpLayout: 'grid', label: '核算主体' });\n  host.configurePicker(e2, { dictCode: 'gl_account', hierarchical: true, helpLayout: 'grid', label: '会计科目', filters: {} });\n  host.configurePicker(e3, { dictCode: 'cost_center', hierarchical: true, helpLayout: 'grid', label: '成本中心', filters: {} });\n  function refreshPipe() {\n    var f = host.__pipeEntityId ? { acct_entity_id: host.__pipeEntityId } : {};\n    host.configurePicker(e2, { dictCode: 'gl_account', hierarchical: true, helpLayout: 'grid', label: '会计科目', filters: f });\n    host.configurePicker(e3, { dictCode: 'cost_center', hierarchical: true, helpLayout: 'grid', label: '成本中心', filters: f });\n    e2.clearValue && e2.clearValue({ silent: true });\n    e3.clearValue && e3.clearValue({ silent: true });\n    var sum = host.shadowRoot.querySelector('#pipeSummary');\n    if (sum) sum.textContent = host.__pipeEntityId ? ('管道过滤 acct_entity_id=' + host.__pipeEntityId) : '管道未贯通 — 请先选核算主体';\n  }\n  if (!e1.__pipeWired) {\n    e1.__pipeWired = true;\n    e1.addEventListener('cmx-dict-change', function(ev) {\n      host.__pipeEntityId = ev.detail && ev.detail.id != null ? ev.detail.id : null;\n      refreshPipe();\n      host.pushTimeline('管道·主体', host.__pipeEntityId || '(清空)');\n    });\n  }\n  host.wirePickerEcho(e2, null, '管道·科目');\n  host.wirePickerEcho(e3, null, '管道·成本');\n  refreshPipe();\n};\n\nhost.setupMirrors = function() {\n  var a = host.shadowRoot.querySelector('#mirrorA');\n  var b = host.shadowRoot.querySelector('#mirrorB');\n  var st = host.__labState;\n  host.configurePicker(a, { dictCode: st.dictId, hierarchical: st.hierarchical, helpLayout: 'grid', label: '镜A' });\n  var catTree = {\n    search: function() {\n      return host.dictFetch(host.dctSearchUrl('partner_category_dict'), { q: '', page: 1, pageSize: 200 }).then(function(j) {\n        var rows = (j && j.rows) ? j.rows : [];\n        return rows.map(function(r) { return { id: r.id, path: r.full_path || r.id, name: r.item_name || r.item_code }; });\n      });\n    }\n  };\n  host.configurePicker(b, {\n    dictCode: 'partner', hierarchical: false, helpLayout: 'classify', label: '合作伙伴',\n    dataSource: host.makeGlDictSource('partner'),\n    classifyTreeSource: catTree\n  });\n  host.wirePickerEcho(a, '#mirrorAEcho', '镜A');\n  host.wirePickerEcho(b, '#mirrorBEcho', '镜B');\n};\n\nhost.runMultiSearchRadar = function() {\n  var status = host.shadowRoot.querySelector('#radarStatus');\n  if (status) status.textContent = '联查中…';\n  var body = {\n    q: '',\n    propagateQ: false,\n    query: {\n      dictId: 'acct_entity',\n      pageSize: 20,\n      children: [\n        { dictId: 'gl_account', joinOn: { parentField: 'acct_entity_id', fromField: 'id' }, pageSize: 50 },\n        { dictId: 'cost_center', joinOn: { parentField: 'acct_entity_id', fromField: 'id' }, pageSize: 30 }\n      ]\n    }\n  };\n  Promise.all([\n      host.dictFetch(host.dctSearchUrl('acct_entity'), { q: '', page: 1, pageSize: 20 }),\n      host.dictFetch(host.dctSearchUrl('gl_account'), { q: '', page: 1, pageSize: 50 }),\n      host.dictFetch(host.dctSearchUrl('cost_center'), { q: '', page: 1, pageSize: 30 })\n    ]).then(function(rs) {\n    var res = { acct_entity: { rows: host.adaptDictRows(rs[0]) } };\n    var root = res && res.acct_entity;\n    var rows = (root && root.rows) ? root.rows : [];\n    var flat = [];\n    rows.forEach(function(ent) {\n      var accRows = (ent.gl_account && ent.gl_account.rows && ent.gl_account.rows.length) ? ent.gl_account.rows : [{ item_code: '', item_name: '(无科目)' }];\n      var ccRows = (ent.cost_center && ent.cost_center.rows && ent.cost_center.rows.length) ? ent.cost_center.rows : [{ item_code: '', item_name: '(无成本中心)' }];\n      accRows.forEach(function(acc) {\n        ccRows.forEach(function(cc) {\n          flat.push({ entity_code: ent.item_code, entity_name: ent.item_name, account_code: acc.item_code, account_name: acc.item_name, cost_code: cc.item_code, cost_name: cc.item_name });\n        });\n      });\n    });\n    var counts = { acct_entity: rows.length, gl_account: 0, cost_center: 0 };\n    rows.forEach(function(ent) {\n      if (ent.gl_account && ent.gl_account.rows) counts.gl_account += ent.gl_account.rows.length;\n      if (ent.cost_center && ent.cost_center.rows) counts.cost_center += ent.cost_center.rows.length;\n    });\n    host.renderRadarBars(counts);\n    if (host.ms) host.ms.setFlatData({ radarRows: flat });\n    if (status) status.textContent = 'join 笛卡尔展开 ' + flat.length + ' 条（主体 × 科目 × 成本）';\n    host.pushTimeline('联查雷达', flat.length + ' 条 join 路径');\n  }).catch(function(e) {\n    if (status) status.textContent = '联查失败: ' + e.message;\n  });\n};\n\nhost.renderRadarBars = function(counts) {\n  var box = host.shadowRoot.querySelector('#radarBars');\n  if (!box) return;\n  box.innerHTML = '';\n  Object.keys(counts).forEach(function(k) {\n    var n = counts[k];\n    var w = Math.min(100, 20 + n * 12);\n    var div = document.createElement('div');\n    div.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:0.7rem;min-width:120px;';\n    div.innerHTML = '<span style=\"width:72px;\">' + k + '</span><div style=\"height:8px;width:' + w + 'px;background:var(--sapHighlightColor);border-radius:4px;\"></div><b>' + n + '</b>';\n    box.appendChild(div);\n  });\n};\n\nhost.renderLayoutSeg();\nhost.clearFlightLog();\n\nhost.dictFetch('/api/definitions/list?kind=DCT&domain=fi').then(function(j) {\n  var items = (j && ((j.data && j.data.items) || j.items)) || [];\n  var byId = {};\n  items.forEach(function(it) {\n    var qs = 'domain=' + encodeURIComponent(it.domain) + '&application=' + encodeURIComponent(it.application) + '&module=' + encodeURIComponent(it.module) + (it.file ? ('&file=' + encodeURIComponent(it.file)) : '');\n    (it.dictionaries || []).forEach(function(x) { var c = (x && x.dictCode) || x; if (typeof c === 'string') byId[c] = { dictId: c, label: c, qs: qs }; });\n  });\n  var schemas = Object.keys(byId).map(function(k) { return byId[k]; });\n  host.__labState.schemas = schemas;\n  host.renderSchemaGalaxy(schemas);\n}).catch(function() {\n  host.__labState.schemas = GL_IDS.map(function(id) { return { dictId: id, label: id, hierarchical: true }; });\n  host.renderSchemaGalaxy(host.__labState.schemas);\n});\n\nvar picker = host.shadowRoot.querySelector('#labPicker');\nhost.wirePickerEcho(picker, '#labPickEcho', '主实验台');\nhost.applyLabConfig();\nhost.setupMirrors();\nhost.setupCascadePipe();\n\nvar grid = host.shadowRoot.querySelector('#radarGrid');\nif (grid && host.radarModel) {\n  grid.setColumnModel(host.radarModel);\n  grid.setOptions({ selectionMode: 'single', fillHeight: true, showRowIndex: true, readonly: true });\n}\nif (host.ms) host.ms.setFlatData({ radarRows: [] });\nhost.pushTimeline('实验室', '已启动 — 从字典星云选字典或走级联管道');\n","readsVars":[],"writesVars":[]},{"name":"applyLabConfig","params":"","body":"if(host.applyLabConfig)host.applyLabConfig();","readsVars":[],"writesVars":[]},{"name":"clearFlightLog","params":"","body":"if(host.clearFlightLog)host.clearFlightLog();","readsVars":[],"writesVars":[]},{"name":"runMultiSearchRadar","params":"","body":"if(host.runMultiSearchRadar)host.runMultiSearchRadar();","readsVars":[],"writesVars":[]}],"pageServices":[],"pageDeps":[],"pageInterfaces":[{"name":"initPage","enabled":true,"body":"if(host.initDictHelpLab)host.initDictHelpLab();"},{"name":"onActivate","enabled":true,"body":""},{"name":"isDirty","enabled":true,"body":"return false;"},{"name":"getState","enabled":true,"body":"return {};"},{"name":"validate","enabled":true,"body":"return { valid: true };"}],"dataSources":[],"dataFlow":{"schema":[{"id":"radarRows","kind":"list","children":[]}],"aggregations":[],"relations":[]},"models":[{"id":"m1","modelType":"CmxMasterSlave","instanceId":"ms","props":{"schema":[{"id":"radarRows","children":[]}],"aggregations":[]},"events":{}},{"id":"m2","modelType":"CmxColumnModel","instanceId":"radarModel","props":{"datasetId":"radarRows","columns":[{"id":"entity_code","caption":"主体编码","type":"text","width":"100px","editMode":"readonly"},{"id":"entity_name","caption":"主体名称","type":"text","width":"120px","editMode":"readonly"},{"id":"account_code","caption":"科目编码","type":"text","width":"100px","editMode":"readonly"},{"id":"account_name","caption":"科目名称","type":"text","width":"120px","editMode":"readonly"},{"id":"cost_code","caption":"成本中心编码","type":"text","width":"110px","editMode":"readonly"},{"id":"cost_name","caption":"成本中心名称","type":"text","editMode":"readonly"}]},"events":{}}]}</script>
