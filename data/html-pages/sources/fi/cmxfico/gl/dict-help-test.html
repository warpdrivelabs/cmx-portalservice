<div data-node-id="dht-root" style="display:flex;flex-direction:column;width:100%;height:100%;gap:8px;padding:8px;box-sizing:border-box;background:var(--sapBackgroundColor,#fafafa);">

    <ui5-button design="Emphasized" slot="endContent" accessible-role="Button" icon="refresh" data-eventclick="initDictTest();" data-node-id="dht-reload">初始化</ui5-button>
  </ui5-bar>

  <div data-node-id="dht-body" style="flex:1 1 0;min-height:0;display:flex;gap:8px;overflow:hidden;">
    <div data-node-id="dht-left" style="flex:0 0 280px;display:flex;flex-direction:column;background:var(--sapList_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#e0e0e0);border-radius:4px;overflow:hidden;">
      <div data-node-id="dht-left-head" style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--sapGroup_ContentBorderColor,#e0e0e0);background:var(--sapGroup_TitleBackground,transparent);">

        <ui5-title level="H6" size="H6" wrapping-type="Normal" style="margin:0;font-weight:800;color:var(--sapTitleColor);">字典列表</ui5-title>
      </div>
      <div id="dictButtons" data-node-id="dht-dict-buttons" style="display:flex;flex-wrap:wrap;gap:4px;padding:8px;overflow:auto;flex:1 1 0;align-content:flex-start;"></div>
    </div>

    <div data-node-id="dht-center" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px;overflow:hidden;">
      <div data-node-id="dht-picker-card" style="flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:12px;background:var(--sapList_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#e0e0e0);border-radius:4px;">
        <div style="display:flex;align-items:center;gap:6px;" data-node-id="dht-picker-head">

          <ui5-title level="H6" size="H6" wrapping-type="Normal" style="margin:0;font-weight:800;color:var(--sapTitleColor);">字典选择</ui5-title>
          <ui5-label id="activeDictTitle" wrapping-type="Normal" style="font-size:0.8rem;color:var(--sapContent_LabelColor);">会计科目（gl_account）</ui5-label>

        <ui5-label id="pickResult" wrapping-type="Normal" style="font-size:0.75rem;color:var(--sapContent_LabelColor);min-height:1.2rem;">未选择</ui5-label>
      </div>

      <div data-node-id="dht-table-card" style="flex:1 1 0;min-height:0;display:flex;flex-direction:column;background:var(--sapList_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#e0e0e0);border-radius:4px;overflow:hidden;">
        <div data-node-id="dht-table-head" style="display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-bottom:1px solid var(--sapGroup_ContentBorderColor,#e0e0e0);">
          <div style="display:flex;align-items:center;gap:6px;">
            <ui5-icon name="table-view" style="color:var(--sapInformativeTextColor,var(--sapHighlightColor));" mode="Decorative"></ui5-icon>
            <ui5-title id="dictRowsTitle" level="H6" size="H6" wrapping-type="Normal" style="margin:0;font-weight:800;color:var(--sapTitleColor);">会计科目数据</ui5-title>
          </div>
          <div style="display:flex;gap:4px;align-items:center;">
            <ui5-label id="dictRowsCount" wrapping-type="Normal" style="font-size:0.75rem;color:var(--sapContent_LabelColor);">0 行</ui5-label>
            <ui5-button design="Transparent" icon="refresh" accessible-role="Button" data-eventclick="reloadActiveDict();" data-node-id="dht-table-refresh">刷新</ui5-button>
          </div>
        </div>
        <cmx-revo-grid id="dictGrid" data-cmx-master-slave-id="ms" data-cmx-dataset-id="dictRows" data-cmx-model-id="dictRowModel" style="display:block;width:100%;flex:1 1 0%;" data-node-id="dht-grid"></cmx-revo-grid>
      </div>
    </div>

    <div data-node-id="dht-right" style="flex:0 0 340px;display:flex;flex-direction:column;background:var(--sapList_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#e0e0e0);border-radius:4px;overflow:hidden;">
      <div data-node-id="dht-right-head" style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--sapGroup_ContentBorderColor,#e0e0e0);background:var(--sapGroup_TitleBackground,transparent);">
        <ui5-icon name="detail-view" style="color:var(--sapInformativeTextColor,var(--sapHighlightColor));" mode="Decorative"></ui5-icon>
        <ui5-title level="H6" size="H6" wrapping-type="Normal" style="margin:0;font-weight:800;color:var(--sapTitleColor);">选中详情</ui5-title>
      </div>
      <div id="dictDetail" style="padding:8px;overflow:auto;flex:1 1 0;font-size:0.8rem;line-height:1.6;color:var(--sapContent_LabelColor);">
        <ui5-label wrapping-type="Normal">请在左侧字典选择中选取一条数据</ui5-label>
      </div>
    </div>
  </div>
</div>
