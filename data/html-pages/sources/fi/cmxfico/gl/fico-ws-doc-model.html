批，depth:2 只取 header 拿 count/voucher_ids)  ② 单张凭证按需装(depth:4，不缓存)\n   ③ layer-id(cv_*)→relation-name(batch/headers/account_lines/aux_lines) 适配。 */\nvar DOC_DEF={ domain:'fi', application:APP, module:'gl', file:'cmxfico_doc_meta_v1.json', dbId:'fico-db' };\nvar PAGE_SIZE=3;   /* 凭证批每页 3 批 */\nvar DOC_ENDPOINT='/api/doc/data/tokio-zmc-msgpack';\n/* pkg 节点(列式包 {datasetId,columns,rows:[[..]],childRows})的一行数组 → {列名:值} 对象。 */\nfunction rowObj(node, r){ var o={}; var cols=node.columns||[]; for(var i=0;i<cols.length;i++){ o[cols[i]]=r[i]; } return o; }\nfunction nodeObjs(node){ return ((node&&node.rows)||[]).map(function(r){ return rowObj(node,r); }); }\n/* 取某 pkg 节点在某父行下的某子层节点(childRows 按 layer-id 键)。 */\nfunction childNode(node, parentId, childLayerId){ var cr=(node&&node.childRows)||{}; var byId=cr[parentId]; return byId?byId[childLayerId]:null; }\n/* loadDocData 便捷封装：返回原始列式包 pkg(含 childRows 整树)。 */\nfunction docLoad(query){ return (lib&&lib.loadDocData) ? lib.loadDocData(host, { domain:DOC_DEF.domain, application:DOC_DEF.application, module:DOC_DEF.module, file:DOC_DEF.file, dbId:DOC_DEF.dbId, binary:true, apiPath:DOC_ENDPOINT, query:query }).then(function(r){ return r.pkg; }) : Promise.reject(new Error('loadDocData 未加载')); }\n/* 凭证批总数(分页条算 totalPages 用)：装 cv_batch 层(depth:1，仅根)数行数。缓存一次，翻页不重取。 */\nfunction loadBatchTotal(){\n  if(host.__batchTotal!=null) return Promise.resolve(host.__batchTotal);\n  return docLoad({ depth:1, layers:{ cv_batch:{ orderBy:['id'] } } }).then(function(pkg){\n    host.__batchTotal=(pkg.rows||[]).length; return host.__batchTotal;\n  });\n}\n/* 批列表第 page 页(每页 PAGE_SIZE 批)：depth:2 装 batch→header，映射成 explorer 期望的批页形状。\n   只到 header(拿 count + voucher_ids=header id 列表)，不装 acc/aux 明细。不缓存明细。 */\nfunction loadBatchListPage(page){\n  var p=+page||0; if(p<0)p=0;\n  return loadBatchTotal().then(function(total){\n    var totalPages=Math.max(1, Math.ceil(total/PAGE_SIZE));\n    if(p>=totalPages) p=totalPages-1;\n    return docLoad({ depth:2, layers:{ cv_batch:{ orderBy:['id'], limit:PAGE_SIZE, offset:p*PAGE_SIZE } } }).then(function(pkg){\n      var batches=(pkg.rows||[]).map(function(br,i){\n        var b=rowObj(pkg, br); var bid=b.id;\n        var hdrNode=childNode(pkg, bid, 'cv_header');\n        var voucher_ids=((hdrNode&&hdrNode.rows)||[]).map(function(hr){ return rowObj(hdrNode,hr).id; });\n        return { idx:p*PAGE_SIZE+i, batch_no:bid, batch_name:b.batch_name, count:voucher_ids.length, voucher_ids:voucher_ids, comp_unit_id:b.comp_unit_id, __batchObj:b };\n      });\n      return { page:p, pageSize:PAGE_SIZE, total:total, totalPages:totalPages, batches:batches };\n    });\n  });\n}\n/* 单张凭证懒加载(depth:4，装 batch→该 header→acc→aux)：按 batchId + headerId 精确取一张，不缓存，每次重取。\n   返回 {batch, header, account_lines, aux_lines}(即 voucherMS.setFlatData 入参形状)。 */\nfunction loadOneVoucher(batchId, headerId){\n  return docLoad({ depth:4, layers:{ cv_batch:{ filter:{ id:{ '$eq':batchId } } }, cv_header:{ filter:{ id:{ '$eq':headerId } } } } }).then(function(pkg){\n    var bRow=(pkg.rows||[])[0]; if(!bRow) return null;\n    var batchObj=rowObj(pkg, bRow);\n    var hdrNode=childNode(pkg, batchId, 'cv_header');\n    var hr=((hdrNode&&hdrNode.rows)||[])[0]; if(!hr) return null;\n    var header=rowObj(hdrNode, hr); var hid=header.id;\n    var accNode=childNode(hdrNode, hid, 'cv_acc_line');\n    var account_lines=nodeObjs(accNode);\n    var aux_lines=[];\n    ((accNode&&accNode.rows)||[]).forEach(function(ar){\n      var aid=rowObj(accNode,ar).id; var auxNode=childNode(accNode, aid, 'cv_aux_line');\n      if(auxNode) aux_lines=aux_lines.concat(nodeObjs(auxNode));\n    });\n    return { batch:batchObj, header:header, account_lines:account_lines, aux_lines:aux_lines };\n  });\n}\nfunction fireModelEvent(kind, extra){\n  try{\n    var detail={kind:kind}; extra=extra||{};\n    for(var k in extra){ detail[k]=extra[k]; }\n    window.dispatchEvent(new CustomEvent('cmx-fico-doc-model',{detail:detail}));\n  }catch(e){}\n}\nfunction setModelLoading(scope,on,text){\n  host.__loadingState=host.__loadingState||{};\n  host.__loadingState[scope]=!!on;\n  fireModelEvent('loading',{scope:scope,loading:!!on,text:text||'',loadingState:host.__loadingState});\n}\nhost.isLoading=function(scope){ var s=host.__loadingState||{}; return scope ? s[scope]===true : !!(s.meta||s.page||s.voucher); };\n/* 把「一张凭证」装入 MS(替换屏上当前张,不缓存——上一张被 setFlatData 丢弃)。\n   一张凭证 = 1 batch 行 + 1 header 行 + 其科目行 + 其辅助行;MS 四层结构不变,只是每层行数=该张的量。 */\nfunction applyVoucher(v){\n  var ms=host.voucherMS; if(!ms||!v)return;\n  host.__curVoucher=v; host.__curVoucherId=(v.header&&v.header.id)||null;\n  ms.setFlatData({ batch:[v.batch], headers:[v.header], account_lines:v.account_lines||[], aux_lines:v.aux_lines||[] });\n  var c=ctx(); if(c){ c.set('currentBatchId', v.batch&&v.batch.id); c.set('currentVoucherId', host.__curVoucherId); }\n  fireModelEvent('voucher');\n}\nhost.applyVoucher=applyVoucher;\n/* 按当前批的第 idx 张:从后端重取该张凭证文件 → 装入(每次都重取,无缓存) */\nfunction loadVoucherAt(idx){\n  var bs=host.__curBatchSummary; if(!bs||!bs.voucher_ids||!bs.voucher_ids.length) return Promise.resolve(null);\n  var ids=bs.voucher_ids; if(idx<0||idx>=ids.length) return Promise.resolve(null);\n  var headerId=ids[idx];\n  var seq=(host.__voucherReqSeq||0)+1; host.__voucherReqSeq=seq;\n  host.__curVoucherIdx=idx;\n  setModelLoading('voucher',true,'加载凭证 '+headerId);\n  setText('statusText','加载凭证 '+headerId+' ('+(idx+1)+'/'+ids.length+')...');\n  /* 单张懒加载：按 batchId+headerId 现场装该一张(depth:4，含辅助行)，不缓存，每次导航都重取。 */\n  return loadOneVoucher(bs.batch_no, headerId).then(function(v){\n    if(seq!==host.__voucherReqSeq) return null;\n    if(!v){ setText('statusText','凭证 '+headerId+' 装载为空'); fireModelEvent('error',{scope:'voucher',error:'empty'}); return null; }\n    applyVoucher(v); host.__curVoucherIdx=idx;\n    setText('statusText','当前:'+(bs.batch_name||bs.batch_no)+' 第 '+(idx+1)+'/'+ids.length+' 张');\n    return v;\n  }).catch(function(e){\n    if(seq!==host.__voucherReqSeq) return null;\n rror',{scope:'voucher',error:'empty'}); return null; }\n    applyVoucher(v); host.__curVoucherIdx=idx;\n    setText('statusText','当前:'+(bs.batch_name||bs.batch_no)+' 第 '+(idx+1)+'/'+ids.length+' 张');\n    return v;\n  }).catch(function(e){\n    if(seq!==host.__voucherReqSeq) return null;\n    var msg=e&&e.message||e;\n    setText('statusText','凭证加载失败:'+msg);\n    fireModelEvent('error',{scope:'voucher',error:String(msg||'')});\n    return null;\n  }).then(function(v){\n    if(seq===host.__voucherReqSeq) setModelLoading('voucher',false);\n    return v;\n  });\n}\nhost.loadVoucherAt=loadVoucherAt;\n/* ★ peer 经 pageview['fico-ws-doc-model'] 拿到的是 host 元素(非 getPageApi 冻结对象),\n   故 explorer/content 要用的读取器必须挂在 host 上,不能只放进 getPageApi。 */\n/* 当前凭证位置(content 头位置显示用) */\nhost.getVoucherPos=function(){ var bs=host.__curBatchSummary; var n=(bs&&bs.voucher_ids)?bs.voucher_ids.length:0; var i=(host.__curVoucherIdx==null?-1:host.__curVoucherIdx); return { idx:i, total:n, batchName:(bs&&bs.batch_name)||'' }; };\n/* 当前批列表页(explorer 渲染列表+分页条用) */\nhost.getBatchPage=function(){ return host.__batchPage||null; };\nhost.getCurrentPeriod=function(){ return host.__currentPeriod||''; };\nhost.__loadBatchPageCore=function(page, opts){\n  var p=+page||0; if(p<0)p=0;\n  opts=opts||{};\n  if(opts.period!=null) host.__currentPeriod=opts.period;\n  var seq=(host.__pageReqSeq||0)+1; host.__pageReqSeq=seq;\n  setModelLoading('page',true,'加载批列表');\n  setText('statusText','加载批列表第 '+(p+1)+' 页...');\n  return loadBatchListPage(p).then(function(pg){\n    if(seq!==host.__pageReqSeq) return null;\n    host.__batchPage=pg||{batches:[]}; host.__pageReady=true;\n    fireModelEvent('page',{page:p,period:host.__currentPeriod});\n    setText('statusText','批列表第 '+(p+1)+' 页已加载');\n    return host.__batchPage;\n  }).catch(function(e){\n    if(seq!==host.__pageReqSeq) return null;\n    var msg=e&&e.message||e;\n    setText('statusText','批列表页 '+p+' 加载失败:'+msg);\n    fireModelEvent('error',{scope:'page',error:String(  | 'data'(第1张凭证装入)。先查标志命中即同步回调,否则监听事件+长间隔兜底。 */\nfunction onModelReady(kind, cb){\n  function hit(m){ if(!m) return false; return kind==='meta' ? m.__metaReady : m.__ready; }\n  var m=modelHost(); if(hit(m)){ cb(m); return; }\n  function h(ev){ var mm=modelHost(); if(hit(mm)){ window.removeEventListener('cmx-fico-doc-model', h); cb(mm); } }\n  window.addEventListener('cmx-fico-doc-model', h);\n  var n=0,t=setInterval(function(){ var mm=modelHost(); if(hit(mm)){ clearInterval(t); window.removeEventListener('cmx-fico-doc-model',h); cb(mm); } if(++n>120){clearInterval(t);} },80);\n}\n/* 持续订阅 model 生命周期事件:kind='page'(批列表页变化) | 'voucher'(当前凭证变化)。纯订阅,不查标志。 */\nfunction onModelEvent(kind, cb){ window.addEventListener('cmx-fico-doc-model', function(ev){ if(ev&&ev.detail&&ev.detail.kind===kind) cb(modelHost()); }); }\n\nvar APP='cmxfico';\n/* 凭证数据访问层（新 doc 装载服务版·分页+单张懒加载+全4层）：走 __cmxDataComp.loadDocData\n   二进制通道(tokio-zmc-msgpack，真实 DB、ZmcDataSet 零拷贝、元数据驱动)，不读静态 fact 文件。\n   ① 批列表分页(每页3批，depth:2 只取 header 拿 count/voucher_ids)  ② 单张凭证按需装(depth:4，不缓存)\n   ③ layer-id(cv_*)→relation-name(batch/headers/account_lines/aux_lines) 适配。 */\nvar DOC_DEF={ domain:'fi', application:APP, module:'gl', file:'cmxfico_doc_meta_v1.json', dbId:'fico-db' };\nvar PAGE_SIZE=3;   /* 凭证批每页 3 批 */\nvar DOC_ENDPOINT='/api/doc/data/tokio-zmc-msgpack';\n/* pkg 节点(列式包 {datasetId,columns,rows:[[..]],childRows})的一行数组 → {列名:值} 对象。 */\nfunction rowObj(node, r){ var o={}; var cols=node.columns||[]; for(var i=0;i<cols.length;i++){ o[cols[i]]=r[i]; } return o; }\nfunction nodeObjs(node){ return ((node&&node.rows)||[]).map(function(r){ return rowObj(node,r); }); }\n/* 取某 pkg 节点在某父行下的某子层节点(childRows 按 layer-id 键)。 */\nfunction childNode(node, parentId, childLayerId){ var cr=(node&&node.childRows)||{}; var byId=cr[parentId]; return byId?byId[childLayerId]:null; }\n/* loadDocData 便捷封装：返回原始列式包 pkg(含 childRows 整树)。 */\nfunction docLoad(query){ return (lib&&lib.loadDocData) ? lib.loadDocData(host, { domain:DOC_DEF.domain, application:DOC_DEF.application, module:DOC_DEF.module, file:DOC_DEF.file, dbId:DOC_DEF.dbId, binary:true, apiPath:DOC_ENDPOINT, query:query }).then(function(r){ return r.pkg; }) : Promise.reject(new Error('loadDocData 未加载')); }\n/* 凭证批总数(分页条算 totalPages 用)：装 cv_batch 层(depth:1，仅根)数行数。缓存一次，翻页不重取。 */\nfunction loadBatchTotal(){\n  if(host.__batchTotal!=null) return Promise.resolve(host.__batchTotal);\n  return docLoad({ depth:1, layers:{ cv_batch:{ orderBy:['id'] } } }).then(function(pkg){\n    host.__batchTotal=(pkg.rows||[]).length; return host.__batchTotal;\n  });\n}\n/* 批列表第 page 页(每页 PAGE_SIZE 批)：depth:2 装 batch→header，映射成 explorer 期望的批页形状。\n   只到 header(拿 count + voucher_ids=header id 列表)，不装 acc/aux 明细。不缓存明细。 */\nfunction loadBatchListPage(page){\n  var p=+page||0; if(p<0)p=0;\n  return loadBatchTotal().then(function(total){\n    var totalPages=Math.max(1, Math.ceil(total/PAGE_SIZE));\n    if(p>=totalPages) p=totalPages-1;\n    return docLoad({ depth:2, layers:{ cv_batch:{ orderBy:['id'], limit:PAGE_SIZE, offset:p*PAGE_SIZE } } }).then(function(pkg){\n      var batches=(pkg.rows||[]).map(function(br,i){\n        var b=rowObj(pkg, br); var bid=b.id;\n        var hdrNode=childNode(pkg, bid, 'cv_header');\n        var voucher_ids=((hdrNode&&hdrNode.rows)||[]).map(function(hr){ return rowObj(hdrNode,hr).id; });\n        return { idx:p*PAGE_SIZE+i, batch_no:bid, batch_name:b.batch_name, count:voucher_ids.length, voucher_ids:voucher_ids, comp_unit_id:b.comp_unit_id, __batchObj:b };\n      });\n      return { page:p, pageSize:PAGE_SIZE, total:total, totalPages:totalPages, batches:batches };\n    });\n  });\n}\n/* 单张凭证懒加载(depth:4，装 batch→该 header→acc→aux)：按 batchId + headerId 精确取一张，不缓存，每次重取。\n   返回 {batch, header, account_lines, aux_lines}(即 voucherMS.setFlatData 入参形状)。 */\nfunction loadOneVoucher(batchId, headerId){\n  return docLoad({ depth:4, layers:{ cv_batch:{ filter:{ id:{ '$eq':batchId } } }, cv_header:{ filter:{ id:{ '$eq':headerId } } } } }).then(function(pkg){\n    var bRow=(pkg.rows||[])[0]; if(!bRow) return null;\n    var batchObj=rowObj(pkg, bRow);\n    var hdrNode=childNode(pkg, batchId, 'cv_header');\n    var hr=((hdrNode&&hdrNode.rows)||[])[0]; if(!hr) return null;\n    var header=rowObj(hdrNode, hr); var hid=header.id;\n    var accNode=childNode(hdrNode, hid, 'cv_acc_line');\n    var account_lines=nodeObjs(accNode);\n    var aux_lines=[];\n    ((accNode&&accNode.rows)||[]).forEach(function(ar){\n      var aid=rowObj(accNode,ar).id; var auxNode=childNode(accNode, aid, 'cv_aux_line');\n      if(auxNode) aux_lines=aux_lines.concat(nodeObjs(auxNode));\n    });\n    return { batch:batchObj, header:header, account_lines:account_lines, aux_lines:aux_lines };\n  });\n}\nfunction fireModelEvent(kind, extra){\n  try{\n    var detail={kind:kind}; extra=extra||{};\n    for(var k in extra){ detail[k]=extra[k]; }\n    window.dispatchEvent(new CustomEvent('cmx-fico-doc-model',{detail:detail}));\n  }catch(e){}\n}\nfunction setModelLoading(scope,on,text){\n  host.__loadingState=host.__loadingState||{};\n  host.__loadingState[scope]=!!on;\n  fireModelEvent('loading',{scope:scope,loading:!!on,text:text||'',loadingState:host.__loadingState});\n}\nhost.isLoading=function(scope){ var s=host.__loadingState||{}; return scope ? s[scope]===true : !!(s.meta||s.page||s.voucher); };\n/* 把「一张凭证」装入 MS(替换屏上当前张,不缓存——上一张被 setFlatData 丢弃)。\n   一张凭证 = 1 batch 行 + 1 header 行 + 其科目行 + 其辅助行;MS 四层结构不变,只是每层行数=该张的量。 */\nfunction applyVoucher(v){\n  var ms=host.voucherMS; if(!ms||!v)return;\n  host.__curVoucher=v; host.__curVoucherId=(v.header&&v.header.id)||null;\n  ms.setFlatData({ batch:[v.batch], headers:[v.header], account_lines:v.account_lines||[], aux_lines:v.aux_lines||[] });\n  var c=ctx(); if(c){ c.set('currentBatchId', v.batch&&v.batch.id); c.set('currentVoucherId', host.__curVoucherId); }\n  fireModelEvent('voucher');\n}\nhost.applyVoucher=applyVoucher;\n/* 按当前批的第 idx 张:从后端重取该张凭证文件 → 装入(每次都重取,无缓存) */\nfunction loadVoucherAt(idx){\n  var bs=host.__curBatchSummary; if(!bs||!bs.voucher_ids||!bs.voucher_ids.length) return Promise.resolve(null);\n  var ids=bs.voucher_ids; if(idx<0||idx>=ids.length) return Promise.resolve(null);\n  var headerId=ids[idx];\n  var seq=(host.__voucherReqSeq||0)+1; host.__voucherReqSeq=seq;\n  host.__curVoucherIdx=idx;\n  setModelLoading('voucher',true,'加载凭证 '+headerId);\n  setText('statusText','加载凭证 '+headerId+' ('+(idx+1)+'/'+ids.length+')...');\n  /* 单张懒加载：按 batchId+headerId 现场装该一张(depth:4，含辅助行)，不缓存，每次导航都重取。 */\n  return loadOneVoucher(bs.batch_no, headerId).then(function(v){\n    if(seq!==host.__voucherReqSeq) return null;\n    if(!v){ setText('statusText','凭证 '+headerId+' 装载为空'); fireModelEvent('error',{scope:'voucher',error:'empty'}); return null; }\n    applyVoucher(v); host.__curVoucherIdx=idx;\n    setText('statusText','当前:'+(bs.batch_name||bs.batch_no)+' 第 '+(idx+1)+'/'+ids.length+' 张');\n    return v;\n  }).catch(function(e){\n    if(seq!==host.__voucherReqSeq) return null;\n    var msg=e&&e.message||e;\n    setText('statusText','凭证加载失败:'+msg);\n    fireModelEvent('error',{scope:'voucher',error:String(msg||'')});\n    return null;\n  }).then(function(v){\n    if(seq===host.__voucherReqSeq) setModelLoading('voucher',false);\n    return v;\n  });\n}\nhost.loadVoucherAt=loadVoucherAt;\n/* ★ peer 经 pageview['fico-ws-doc-model'] 拿到的是 host 元素(非 getPageApi 冻结对象),\n   故 explorer/content 要用的读取器必须挂在 host 上,不能只放进 getPageApi。 */\n/* 当前凭证位置(content 头位置显示用) */\nhost.getVoucherPos=function(){ var bs=host.__curBatchSummary; var n=(bs&&bs.voucher_ids)?bs.voucher_ids.length:0; var i=(host.__curVoucherIdx==null?-1:host.__curVoucherIdx); return { idx:i, total:n, batchName:(bs&&bs.batch_name)||'' }; };\n/* 当前批列表页(explorer 渲染列表+分页条用) */\nhost.getBatchPage=function(){ return host.__batchPage||null; };\nhost.getCurrentPeriod=function(){ return host.__currentPeriod||''; };\nhost.__loadBatchPageCore=function(page, opts){\n  var p=+page||0; if(p<0)p=0;\n  opts=opts||{};\n  if(opts.period!=null) host.__currentPeriod=opts.period;\n  var seq=(host.__pageReqSeq||0)+1; host.__pageReqSeq=seq;\n  setModelLoading('page',true,'加载批列表');\n  setText('statusText','加载批列表第 '+(p+1)+' 页...');\n  return loadBatchListPage(p).then(function(pg){\n    if(seq!==host.__pageReqSeq) return null;\n    host.__batchPage=pg||{batches:[]}; host.__pageReady=true;\n    fireModelEvent('page',{page:p,period:host.__currentPeriod});\n    setText('statusText','批列表第 '+(p+1)+' 页已加载');\n    return host.__batchPage;\n  }).catch(function(e){\n    if(seq!==host.__pageReqSeq) return null;\n    var msg=e&&e.message||e;\n    setText('statusText','批列表页 '+p+' 加载失败:'+msg);\n    fireModelEvent('error',{scope:'page',error:String(msg||'')});\n    return null;\n  }).then(function(pg){\n    if(seq===host.__pageReqSeq) setModelLoading('page',false);\n    return pg;\n  });\n};\n\nsetText('statusText','加载共享模型...');\n/* 列模型构建(只依赖 DOC,不依赖凭证数据) */\nfunction buildColModels(doc, bases){\n  /* 解析某层「合并后全部字段」= documentFieldSets 引用的字段集字段(按引用顺序)+ inline fields,按 id 去重保留首个\n     (与前端 cmx-meta-model 合并口径一致)。这样 id/upper_id/line_no 及 create_by 等技术字段(都来自 fieldSet)全都纳入,\n     ui5-form/grid 才能把所有字段(含技术字段)显示出来。 */\n  function fieldSetFields(setName){\n    var bs=bases||{};\n    for(var k in bs){ var fsmap=bs[k]&&bs[k].fieldSets; if(fsmap&&fsmap[setName]&&fsmap[setName].fields) return fsmap[setName].fields; }\n    return [];\n  }\n  function rawTbl(lvl){ var ts=(doc&&doc.voucherTables)||[]; return ts[LEVELS.indexOf(lvl)]||{fields:[]}; }\n  function mergedFields(lvl){\n    var t=rawTbl(lvl); var out=[]; var seen={};\n    (t.documentFieldSets||[]).forEach(function(sn){ fieldSetFields(sn).forEach(function(f){ if(f&&f.id&&!seen[f.id]){seen[f.id]=1;out.push(f);} }); });\n    (t.fields||[]).forEach(function(f){ if(f&&f.id&&!seen[f.id]){seen[f.id]=1;out.push(f);} });\n    return out;\n  }\n  function tbl(lvl){ return { fields: mergedFields(lvl) }; }   /* tbl().fields 现为「合并后全部字段」 */\n  /* 字段显示名统一来源:取 DOC 元数据 caption(zh_CN)。peer 页(fx/budget 等)也经 host.capOf 取,杜绝写死。 */\n  function capOf(lvl, fid){ var f=(tbl(lvl).fields||[]).filter(function(x){return x.id===fid;})[0];\n    return f?((f.caption&&f.caption.zh_CN)||f.caption||fid):fid; }\n  host.capOf=function(lvl,fid){ return capOf(lvl,fid); };\n  /* 整数型(BIGINT/INT/TINYINT/SMALLINT)的 字典id列/序号列/上下级联动键列 一律按「字符串」显示+编辑:\n     这些是标识/序号,不是度量,绝不能走数值格式化(否则 grid 会千分位+2位小数,如 1200002→\"1,200,002.00\"、0→空)。\n     度量金额是 DECIMAL(measure),不受影响。把 dataType 改成 VARCHAR 即让 grid 以纯文本显示/编辑(cmx-text-input)。 */\n  var INT_TYPES={BIGINT:1,INT:1,TINYINT:1,SMALLINT:1,INTEGER:1};\n  function asStr(dt,dim){ return (INT_TYPES[String(dt||'').toUpperCase()] && dim!=='measure') ? 'VARCHAR' : (dt||'VARCHAR'); }\n  /* cols(lvl, only):\n       only 缺省 → 该层全部 DOC 字段(顺序即元数据顺序;level_N_id 联动键现已是 DOC 字段,自带正确 caption);\n       only=[字段id...] → 只取这些字段、按给定顺序。\n     字段显示名一律取元数据 caption(f.caption.zh_CN),不再写死,保证与 DOC 定义一致。 */\n  function cols(lvl, only){\n    var fs=(tbl(lvl).fields)||[]; var byId={}; fs.forEach(function(f){byId[f.id]=f;});\n    function mkCol(f){ var w=(f.dimType==='measure')?'120px':'130px';\n      var c={id:f.id,caption:(f.caption&&f.caption.zh_CN)||f.caption||f.id,dataType:asStr(f.dataType,f.dimType),width:w};\n      if(f.dimType==='measure')c.display={align:'right'}; return new lib.CmxColumn(c); }\n    var list = (only&&only.length) ? only.filter(function(id){return byId[id];}) : fs.map(function(f){return f.id;});\n    return list.map(function(id){return mkCol(byId[id]);});\n  }\n  /* 各层默认列模型:完整(详情 form 用)。 */\n  var CM={batch:'colBatch',headers:'colHeader',account_lines:'colAccount',aux_lines:'colAux'};\n  LEVELS.forEach(function(lvl){ var cm=host[CM[lvl]]; if(cm&&cm.setMembers) cm.setMembers(cols(lvl)); });\n  /* 科目行 grid 精简列模型(只显示:总账科目/行项目文本/输入币借方/输入币贷方),与完整 colAccount 并存。 */\n  if(host.colAccountGrid&&host.colAccountGrid.setMembers){\n    host.colAccountGrid.setMembers(cols('account_lines', ['gl_account_id','item_text','entered_dr','entered_cr']));\n  }\n  var HDR_BIZ=['doc_no','doc_date_in','comp_unit_id','posting_date','header_text'];\n  if(host.colHeaderBiz&&host.colHeaderBiz.setMembers){\n    var hf=(tbl('headers').fields)||[]; var byId={}; hf.forEach(function(f){byId[f.id]=f;});\n    var bizCols=HDR_BIZ.filter(function(id){return byId[id];}).map(function(id){var f=byId[id];\n      var c={id:id,caption:(f.caption&&f.caption.zh_CN)||f.caption||id,dataType:asStr(f.dataType,f.dimType),width:'130px'};\n      if(id==='header_text')c.colspan=2;\n      return new lib.CmxColumn(c);});\n    host.colHeaderBiz.setMembers(bizCols);\n  }\n  if(host.colBatchList&&host.colBatchList.setMembers){\n    host.colBatchList.setMembers([ new lib.CmxColumn({id:'batch_name',caption:capOf('batch','batch_name')}), new lib.CmxColumn({id:'__sub',caption:'副'}) ]);\n  }\n}\nfunction start(L){\n  /* 不缓存任何批/张数据:只持有「当前批列表页」+「当前一张凭证」,切换即丢弃旧的重取新的。\n     两个请求并行:DOC 元模型 / 批列表第1页。首张凭证在 DOC+第1页就绪后再取。\n     (注:总批数/分页等信息已内联在每个批列表分页文件里,无需再单独取 cmxfico_meta.json。) */\n  var pDoc  = host.loadDocMeta({ refs:[{domain:'fi',application:'cmxfico',module:'gl',kind:'DOC',id:'cmxfico'}] });\n  var pPg0  = host.__loadBatchPageCore ? host.__loadBatchPageCore(0) : loadBatchListPage(0);\n\n  /* ① DOC 回来:灌列模型 → metaReady(peer 可先出表头/表单骨架) */\n  pDoc.then(function(rd){\n    var doc=(rd&&rd.items&&rd.items[0]&&rd.items[0].doc)||null;\n    var bases=(rd&&rd.bases)||{};   /* 字段集定义(documentFieldSets 引用的 base),用于展开技术字段 */\n    host.__doc=doc; host.__bases=bases; buildColModels(doc, bases);\n    host.__metaReady=true; fireModelReady('meta');\n    setText('statusText','列模型就绪,等数据...');\n  }).catch(function(e){ setText('statusText','DOC 加载失败:'+(e&&e.message||e)); });\n\n  /* ② 批列表第1页:explorer 可先渲染分页列表(只是批概要,不含凭证内容) */\n  pPg0.then(function(pg){ if(pg){ host.__batchPage=pg; host.__pageReady=true; } })\n      .catch(function(e){ setText('statusText','批列表加载失败:'+(e&&e.message||e)); });\n\n  /* ③ DOC+第1页就绪 → 选第1批、只加载它的第1张凭证 → ready */\n  Promise.all([pDoc, pPg0]).then(function(rr){\n    var pg=rr[1]||{batches:[]}; host.__batchPage=pg;\n    var ms=host.voucherMS; if(!ms){ setText('statusText','voucherMS 未声明'); return; }\n    var b0=(pg.batches||[])[0]; if(!b0){ setText('statusText','无凭证批'); return; }\n    host.__curBatchSummary=b0; host.__curVoucherIdx=null;\n    loadVoucherAt(0).then(function(){ host.__ready=true; fireModelReady('data'); });\n  }).catch(function(e){ setText('statusText','首张凭证加载失败:'+(e&&e.message||e)); });\n}\nfunction waitForLibX(cb){ var n=0,t=setInterval(function(){var L=globalThis.__cmxDataComp; if(L&&L.CmxColumn&&L.CmxDataSet&&host.voucherMS){clearInterval(t);cb(L);} if(++n>200){clearInterval(t);setText('statusText','类库/模型未就绪');}},50); }\nwaitForLibX(start);\n"},{"name":"getPageApi","enabled":true,"body":"return { voucherMS: host.voucherMS, colBatch:host.colBatch, colHeader:host.colHeader, colHeaderBiz:host.colHeaderBiz, colAccount:host.colAccount, colAccountGrid:host.colAccountGrid, colAux:host.colAux, colDetail:host.colDetail, colBatchList:host.colBatchList, capOf:host.capOf, loadBatchPage:host.loadBatchPage, selectBatch:host.selectBatch, gotoVoucher:host.gotoVoucher, getVoucherPos:host.getVoucherPos, getBatchPage:host.getBatchPage, getCurrentPeriod:host.getCurrentPeriod, isLoading:host.isLoading, isReady:function(){return host.__ready===true;}, isMetaReady:function(){return host.__metaReady===true;} };"},{"name":"isDirty","enabled":true,"body":"return false;"}],"dataSources":[],"dataFlow":{"schema":[{"id":"batch","children":[{"id":"headers","children":[{"id":"account_lines","children":[{"id":"aux_lines"}]}]}]}],"aggregations":[],"relations":[{"parent":"batch","child":"headers","parentKey":"id","childKey":"upper_id"},{"parent":"headers","child":"account_lines","parentKey":"id","childKey":"upper_id"},{"parent":"account_lines","child":"aux_lines","parentKey":"id","childKey":"upper_id"}]},"models":[{"modelType":"CmxDOCMeta","instanceId":"docMeta","props":{"domain":"fi","application":"cmxfico","module":"gl","id":"cmxfico","autoLoad":false}},{"modelType":"CmxMasterSlave","instanceId":"voucherMS","props":{"schema":[{"id":"batch","children":[{"id":"headers","children":[{"id":"account_lines","children":[{"id":"aux_lines"}]}]}]}],"relations":[{"parent":"batch","child":"headers","parentKey":"id","childKey":"upper_id"},{"parent":"headers","child":"account_lines","parentKey":"id","childKey":"upper_id"},{"parent":"account_lines","child":"aux_lines","parentKey":"id","childKey":"upper_id"}]}},{"modelType":"CmxColumnModel","instanceId":"colBatch","props":{"datasetId":"batch","columns":[]}},{"modelType":"CmxColumnModel","instanceId":"colHeader","props":{"datasetId":"headers","columns":[]}},{"modelType":"CmxColumnModel","instanceId":"colHeaderBiz","props":{"datasetId":"headers","columns":[]}},{"modelType":"CmxColumnModel","instanceId":"colAccount","props":{"datasetId":"account_lines","columns":[]}},{"modelType":"CmxColumnModel","instanceId":"colAccountGrid","props":{"datasetId":"account_lines","columns":[]}},{"modelType":"CmxColumnModel","instanceId":"colAux","props":{"datasetId":"aux_lines","columns":[]}},{"modelType":"CmxColumnModel","instanceId":"colDetail","props":{"datasetId":"detail","columns":[]}},{"modelType":"CmxColumnModel","instanceId":"colBatchList","props":{"datasetId":"batch","toTitleCols":"batch_name","iconCol":"__sub","columns":[]}}]}</script>
