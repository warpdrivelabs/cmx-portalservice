l:'作废',status:'void'}, saved:{label:'保存',status:'saved'}, audited:{label:'审核',status:'audited'}, paid:{label:'付款',status:'paid'} };\nvar key = String(status || 'draft').toLowerCase();\nif (!host.TRADE_STATUS_MAP[key]) key = 'draft';\n$data.tradeStatus = key;\nvar ms = host.ms;\nif (ms && ms.getFlatData) { var h0=(ms.getFlatData().head||[])[0]; if (h0&&h0.id&&ms.getRow){ var row=ms.getRow('head',h0.id); if(row&&typeof row.set==='function') row.set('tradeStatus',key); else if(row) row.tradeStatus=key; } }\nhost.refreshTradeSeal();","readsVars":[],"writesVars":["tradeStatus"]},{"name":"syncTradeActionButtons","params":"","body":"var root=host.shadowRoot; if(!root) return;\nvar st=($data.tradeStatus||'draft').toLowerCase(); var voided=st==='void'; var paid=st==='paid';\nvar saveBtn=root.querySelector('#tradeSaveBtn'); var submitBtn=root.querySelector('#tradeSubmitBtn'); var editBtn=root.querySelector('#tradeEditBtn');\nfunction dis(el,on){ if(!el)return; if(on){el.setAttribute('disabled','');el.classList.add('is-disabled');} else{el.removeAttribute('disabled');el.classList.remove('is-disabled');} }\ndis(editBtn,voided||paid); dis(saveBtn,voided||paid); dis(submitBtn,voided||paid||st==='draft');\n[saveBtn,submitBtn].forEach(function(el){ if(!el)return; el.removeAttribute('data-done'); el.removeAttribute('data-current'); });\nvar order=['draft','saved','audited','paid']; var idx=order.indexOf(st); if(idx<0) idx=0;\nif(saveBtn&&idx>=1) saveBtn.setAttribute('data-done','true');\nif(submitBtn&&idx>=2) submitBtn.setAttribute('data-done','true');\nif(!voided&&!paid){ if(st==='draft'&&saveBtn) saveBtn.setAttribute('data-current','true'); else if((st==='saved'||st==='audited')&&submitBtn) submitBtn.setAttribute('data-current','true'); }","readsVars":["tradeStatus"],"writesVars":[]},{"name":"doSaveTrade","params":"","body":"if(!host.ms){alert('请先加载示例');return;} if(host.exportMsJson) host.exportMsJson(); host.setTradeStatus('saved'); if(host.setTradeEditMode) host.setTradeEditMode
