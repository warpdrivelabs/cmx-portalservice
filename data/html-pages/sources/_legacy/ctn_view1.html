闭事件触发后整体 remove，\n       observer 自动检测到 menu-item disconnected → 从 action.els 摘除。 */\n    menu.addEventListener('close', function () { menu.remove(); }, { once: true });\n    /* 兼容性：ui5-menu 的开启 API 需要先 attach 到 DOM，再 showAt。 */\n    if (typeof menu.showAt === 'function') {\n      menu.showAt(e.clientX, e.clientY);\n    } else {\n      menu.opener = e.target;\n      menu.open = true;\n    }\n  });"}],"dataSources":[],"dataFlow":{"schema":[],"aggregations":[],"relations":[]},"models":[]}</script>
