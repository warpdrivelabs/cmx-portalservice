<div data-node-id="n-root" style="display:flex;flex-direction:column;width:100%;height:100%;min-height:680px;gap:8px;padding:8px;box-sizing:border-box;background:var(--sapBackgroundColor,#fafafa);overflow:auto;">

  <ui5-bar design="Header" accessible-role="Toolbar" data-node-id="n-hdr">
    <ui5-label slot="startContent" data-node-id="n-hdr-t" wrapping-type="Normal" style="font-weight:800;font-size:1.05rem;color:var(--sapShellTitleColor,var(--sapTitleColor));">grid ↔ form 联动 · 四录入组件（模型面板驱动）</ui5-label>
    <ui5-label slot="endContent" data-node-id="n-hdr-s" wrapping-type="Normal" style="color:var(--sapContent_LabelColor);font-size:0.8rem;">列模型 + 数据集在模型面板定义，grid 与 form 共用</ui5-label>
    <ui5-button design="Emphasized" slot="endContent" icon="show" data-node-id="n-hdr-b" data-eventclick="dumpData();" accessible-role="Button" loading-delay="1000">读取数据集</ui5-button>
  </ui5-bar>

  <!-- 说明条 -->
  <div data-node-id="n-tip" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--sapInformationBackground,#eaf4ff);border:1px solid var(--sapInformationBorderColor,#b3d4ff);border-radius:4px;font-size:0.78rem;color:var(--sapTextColor,#32363a);">
    <span style="font-weight:700;" data-node-id="n-1">联动说明：</span>
    <span data-node-id="n-2">① 点击 grid 任一行 → 下方 form 显示该行；</span>
    <span data-node-id="n-3">② 在 form 里改值（或 grid 单元格双击编辑）→ 另一侧同步；</span>
    <span style="padding:1px 8px;background:var(--sapButton_Background,#fff);color:var(--sapButton_TextColor,#0a6ed1);border-radius:10px;border:1px solid var(--sapButton_BorderColor,#cfe2ff);" data-node-id="n-4">4 列分别用 input / number / date / datetime 四组件</span>
  </div>

  <!-- 上区：grid（列表，所有行）。data-cmx-model-id 取列模型，master-slave 'rows' 路径绑为列表 -->
  <div data-node-id="n-grid-box" style="display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--sapList_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#e0e0e0);border-radius:6px;">
    <div style="display:flex;align-items:center;gap:6px;" data-node-id="n-5">
      <ui5-icon name="table-view" style="color:var(--sapHighlightColor);" design="Default" mode="Decorative" data-node-id="n-6"></ui5-icon>
      <ui5-title level="H6" size="H6" style="margin:0;font-weight:800;color:var(--sapTitleColor);" wrapping-type="Normal" data-node-id="n-7">表格 · cmx-revo-grid（单元格编辑器）</ui5-title>
    </div>
    <cmx-revo-grid id="grid" data-cmx-model-id="rowsModel" data-cmx-master-slave-id="ms" data-cmx-dataset-id="rows" style="display: block; width: 100%; height: 240px;" data-node-id="n-8"></cmx-revo-grid>
  </div>

  <!-- 下区：form（单行，跟随 grid 选中行）。共用同一 rowsModel 生成字段，绑 master-slave 'rows' 路径为单行 -->
  <div data-node-id="n-form-box" style="display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--sapList_Background,#fff);border:1px solid var(--sapGroup_ContentBorderColor,#e0e0e0);border-radius:6px;">
    <div style="display:flex;align-items:center;gap:6px;" data-node-id="n-9">
      <ui5-icon name="edit" style="color:var(--sapHighlightColor);" design="Default" mode="Decorative" data-node-id="n-10"></ui5-icon>
      <ui5-title level="H6" size="H6" style="margin:0;font-weight:800;color:var(--sapTitleColor);" wrapping-type="Normal" data-node-id="n-11">表单 · cmx-ui5-form（字段编辑器，跟随选中行）</ui5-title>
    </div>
    <cmx-ui5-form id="form" data-cmx-model-id="rowsModel" data-cmx-master-slave-id="ms" data-cmx-dataset-id="rows" style="display:block;width:100%;" data-node-id="n-12"></cmx-ui5-form>
  </div>

  <!-- 读取数据集回显 -->
  <ui5-label id="echo" style="font-size:0.72rem;color:var(--sapContent_LabelColor);white-space:pre-wrap;min-height:1rem;padding:0 4px;" wrapping-type="Normal" data-node-id="n-13">点「读取数据集」查看当前共享数据 →</ui5-label>

</div>
