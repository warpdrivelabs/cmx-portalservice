# ============================================
# 基础服务中心配置
# ============================================
# 服务定位为「自由键值表」：urls（手动基址）与 discovery.services（Nacos 服务名），新增微服务
# 只在 toml 加一行键值，无需改代码。定位与传输均 per-key：每键自带 url/discovery 定位
#（url 优先，删 url 即切 Nacos 选例）与可选 transport 覆盖（http|grpc，仅导入调用生效）。
[center_client]
# 部署蓝本：三引擎独立微服务 + 手动基址反代。
# 服务间调用全局传输缺省：http | grpc（grpc 需 [rpc] + 各键 discovery）；键级 transport 可覆盖。
default_transport = "http"
# Nacos 分组（discovery 定位的键共用，缺省 DEFAULT_GROUP）
nacos_group = "DEFAULT_GROUP"
timeout_ms = 30000

# 服务键 → 服务描述（自由表，新增微服务加一行即可）：
# - url       = 静态基址（纯基址无路径，端点由消费方拼接）；与 discovery 并存时 url 优先
# - discovery = Nacos 服务名（删 url 即切服务发现选例；transport=grpc 时必配）
# - transport = http|grpc（仅服务间导入调用生效，反代恒 HTTP；缺省取 default_transport）
# 环境变量覆盖：CENTER_CLIENT__SERVICES__FLOW__URL 等（值需带 scheme，纯数字值会被解析为整数）
[center_client.services]
# 导入器目标：菜单/权限/表单定义导入 → 门户自身统一端点（自环）。
# 服务发现备用值：注册名以各服务 .env 的 NACOS_NAMING_SERVICE_NAME 为准（门户实注册 cmx-portal-local）。
menu = { url = "http://127.0.0.1:8080", discovery = "cmx-portal-local" }
perm = { url = "http://127.0.0.1:8080", discovery = "cmx-portal-local" }
form = { url = "http://127.0.0.1:8080", discovery = "cmx-portal-local" }
# 反代目标：独立微服务。flow → 门户 /api/flow/* 经 FlowProxyModule 转发到其 /api/flow/v1/*；
# report → /api/report-design/*、/api/report-source-bindings*、/api/rpt/compute 恒等转发（无 /v1）；
# rules → /api/rules/* + portal.rules.* 页面反代（规则无内嵌，不配 = 门户无规则路由）。
# model → /api/{dct,dict,doc,model,definitions,flexible-combination,code}/* + 模型中心页面反代
#   （配了 = 反代到独立 cmx-model-server；不配 = 门户进程内嵌 Dct/Doc/Model/Code）。
flow = { url = "http://127.0.0.1:8091", discovery = "cmx-flow-server" }
report = { url = "http://127.0.0.1:8092", discovery = "cmx-rpt-server" }
rules = { url = "http://127.0.0.1:8094", discovery = "cmx-rule-server" }
onto = { url = "http://127.0.0.1:8097", discovery = "cmx-onto-server" }
model = { url = "http://127.0.0.1:8093", discovery = "cmx-model-server" }
mdm = { url = "http://127.0.0.1:8095", discovery = "cmx-mdm-server" }

