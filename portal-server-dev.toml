# ============================================
# 门户微服务配置（cmx-portalservice 独立 workspace）
# ============================================
# 蓝本 = cmx-container/dev-local.toml。差异：本 ws 在 presentation/cmx-portalservice/，若从该目录
# 运行（CONFIG_FILE=./portal-server.toml cargo run -p cmx-portal-server），凡指向 cmx-container 内
# 资源的相对路径需前缀 ../cmx-container/（templates / migration.dir）。指向 presentation 级同胞前端
# 的路径（CMXPortalManager/CMXHTMLDesigner/packages）改为 ../ 前缀。

[server]
host = "0.0.0.0"
port = 8080
# 日志目录 / 日志级别 / 优雅关闭（chassis 框架级；env 覆盖 SERVER__LOG_DIR / SERVER__LOG_LEVEL / SERVER__GRACEFUL_TIMEOUT_SECS）
log_dir = "logs"
log_level = "info"
graceful_timeout_secs = 10

# 部署模式（mono：单体，服务所有域/应用/模块；数据源加载全部 status=1 记录，app_id 固定 default）
[deploy]
mode = "mono"

# 应用标识（仅 micro 模式生效；mono 下整体不生效）
[app]
domain_code = "fi"
application_code = "cmxfico"
module_code = "gl"

# 主键 ID 生成（DCT/DOC bigint id 后端铸号；node_id 跨部署须唯一）
[id_gen]
node_id = 1

# ============================================
# 页面/内容资产（统一 [assets] 段）+ 同源托管前端构建产物
# 路径相对 cmx-portalservice/ 运行目录：前端在 presentation 级 → ../ 前缀。
# env 覆盖：ASSETS__ROOT / ASSETS__WEB_PORTAL_DIST / ...（段名 + __ + 键名大写）。
# ============================================
[assets]
# ★ 内容根：native-pages/html-pages/menu-pages/dict/... 全部页面/字典/单据数据的 JSON 存储根。
#   这些是**平台共享业务数据**，物理仍在 cmx-container/data（P3 只迁 bin 不迁数据）→ 指向它，
#   否则 cwd=cmx-portalservice 下 ./data 不存在，所有页面查不到 → 前端"找不到页面"。
root = "../cmx-container/assets/portal/data"
web_portal_dist = "../CMXPortalManager/dist"
web_html_dist = "../CMXHTMLDesigner/dist"
web_shared_dist = "../packages/cmx-ui5-runtime/dist"
# 页面 moka L1 缓存（进程内文件内容缓存；默认关闭，改后新请求即时生效/重建键需重启）
page_cache_enabled = false
page_cache_ttl_secs = 30
page_cache_max_entries = 4096

