# ============================================
# 门户微服务配置（cmx-portalservice 独立 workspace）
# ============================================
# 蓝本 = cmx-container/dev-local.toml。差异：本 ws 在 presentation/cmx-portalservice/，若从该目录
# 运行（CONFIG_FILE=./portal-server.toml cargo run -p cmx-portal-server），凡指向 cmx-container 内
# 资源的相对路径需前缀 ../cmx-container/（templates / migration.dir）。指向 presentation 级同胞前端
# 的路径（CMXPortalManager/CMXHTMLDesigner/packages）改为 ../ 前缀。

[server]
host = "0.0.0.0"
port = 8080

# 部署模式（mono：单体，服务所有域/应用/模块；数据源加载全部 status=1 记录，app_id 固定 default）
[deploy]
mode = "mono"

# 应用标识（仅 micro 模式生效；mono 下整体不生效）
[app]
domain_code = "fi"
application_code = "cmxfico"
module_code = "gl"

# 主键 ID 生成（DCT/DOC bigint id 后端铸号；node_id 跨部署须唯一）
[id_gen]
node_id = 1

# ============================================
# 门户/设计器业务数据根 + 同源托管前端构建产物
# 路径相对 cmx-portalservice/ 运行目录：前端在 presentation 级 → ../ 前缀。
# ============================================
[portal]
# ★ 业务数据根：native-pages/html-pages/menu-pages/dict/... 全部页面/字典/单据数据的 JSON 存储根。
#   这些是**平台共享业务数据**，物理仍在 cmx-container/data（P3 只迁 bin 不迁数据）→ 指向它，
#   否则 cwd=cmx-portalservice 下 ./data 不存在，所有页面查不到 → 前端"找不到页面"。
data_root = "../cmx-container/data"
web_portal_dist = "../CMXPortalManager/dist"
web_html_dist = "../CMXHTMLDesigner/dist"
web_shared_dist = "../packages/cmx-ui5-runtime/dist"

# ============================================
# 数据源配置数组
# ============================================
[[databases]]
db_id = "primary"
db_name = "主控数据库"
db_type = "postgres"
db_url = "postgresql://postgres:postgres@localhost:5432/cmx"
default = true
pool_config = { max_connections = 15, min_connections = 3, connect_timeout = 20, idle_timeout = 300, max_lifetime = 900 }
health_check_interval = 60
health_check_timeout = 5

[[databases]]
db_id = "fico-db"
db_name = "总账数据库"
db_type = "postgres"
db_url = "postgresql://postgres:postgres@localhost:5432/fico"
default = false
source_type = "biz"
pool_config = { max_connections = 15, min_connections = 3, connect_timeout = 20, idle_timeout = 300, max_lifetime = 900 }
health_check_interval = 60
health_check_timeout = 5

[redis]
url = "redis://localhost:6379/12"

[templates]
# 模板目录在 cmx-container 内 → ../cmx-container/ 前缀
path = "../cmx-container/crates/libs/cmx-dev/templates"

[code_server]
url = "http://127.0.0.1:8081/"

[code_server_extension_server]
url = "http://127.0.0.1:9000"

# WASM 运行时配置
[runtime]
memory_max = 4096
timeout = 30
pool_max_instances = 8
fuel_limit = 0

# 插件配置
[plugin]
install_root = "plugins/root"
backup_root = "plugins/backup"
temp_root = "plugins/temp"
upload_root = "plugins/uploads"

[plugin.auto_install]
enabled = false

# 数据库迁移（启用后自举建表；dir 在 cmx-container 内 → ../cmx-container/ 前缀）
[migration]
enabled = true
dir = "../cmx-container/docs/sql/v2"
validate_checksum = false
# 等待其他节点完成迁移的轮询超时（秒）；超时后按台账决定跳过或接管
lock_wait_timeout = 120

# ============================================
# 文件存储配置
# ============================================
[storage]
default_platform = "local"

[[storage.instances]]
platform = "local"
storage_type = "local"
enable_storage = true
domain = "http://localhost:8080/files/"
base_path = "uploads"
storage_path = "./storage"
enable_access = true
path_patterns = "/files/**"

[[storage.instances]]
platform = "minio"
storage_type = "s3"
enable_storage = true
access_key = "Wa8GQ78My7d0b4AedpLS"
secret_key = "3T0IYmsQP0OeBqKZ1jB5tk3pLmMD3ZT97AnNFIXV"
region = "us-east-1"
endpoint = "http://192.168.157.46:9000/"
bucket_name = "cmx-bucket"
domain = "http://192.168.157.46:9000/"
base_path = "cmx-server/"

# ============================================
# 基础服务中心配置
# ============================================
# 服务定位为「自由键值表」：urls（手动基址）与 discovery.services（Nacos 服务名），新增微服务
# 只在 toml 加一行键值，无需改代码。mode 同时决定导入器传输与反代（flow/report/rules）目标来源
#（local/未知值 → 全内嵌不挂反代；http_url → urls 基址；http_discovery/grpc → Nacos 服务发现）。
[center_client]
# 部署蓝本：三引擎独立微服务 + 手动基址反代（原 mode="mock" 为历史遗留值，已按 urls 配置意图归一）。
mode = "http_url"
timeout_ms = 30000

# URL 直连模式（mode = "http_url" 时生效）：服务键 → 纯基址（无路径，端点由消费方拼接）
[center_client.urls]
# 导入器目标：菜单/权限/表单定义导入 → 门户自身统一端点（自环）
menu = "http://127.0.0.1:8080"
perm = "http://127.0.0.1:8080"
form = "http://127.0.0.1:8080"
# 反代目标：独立微服务基址。flow → 门户 /api/flow/* 经 FlowProxyModule 转发到其 /api/flow/v1/*；
# report → /api/report-design/*、/api/report-source-bindings*、/api/rpt/compute 恒等转发（无 /v1）；
# rules → /api/rules/* + portal.rules.* 页面反代（规则无内嵌，不配 = 门户无规则路由）。
flow = "http://127.0.0.1:8091"
report = "http://127.0.0.1:8092"
rules = "http://127.0.0.1:8094"

# 服务发现模式（mode = "http_discovery" 或 "grpc" 时生效；http_url 下不读，为切发现模式备好）
[center_client.discovery]
nacos_group = "DEFAULT_GROUP"
# 注册名以各服务 .env 的 NACOS_NAMING_SERVICE_NAME 为准（门户实注册 cmx-portal-local）。
[center_client.discovery.services]
menu = "cmx-portal-local"
perm = "cmx-portal-local"
form = "cmx-portal-local"
flow = "cmx-flow-server"
report = "cmx-rpt-server"
rules = "cmx-rule-server"

# ============================================
# RPC 配置（默认关闭）
# ============================================
[rpc]
enabled = false
protocol = "grpc"
warmup_services = []

[rpc.grpc]
port = 9090
timeout_ms = 30000
connect_timeout_ms = 3000
retry_count = 0

